# Activate only after provisioning a certificate for the exact hostname.
server {
 listen 80;
 listen [::]:80;
 server_name docs.genycaster.xyz;
 location / { return 308 https://docs.genycaster.xyz$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name docs.genycaster.xyz;
 root /var/www/docs.genycaster.xyz/current;
 index index.html;
 charset utf-8;
 ssl_certificate /etc/letsencrypt/live/docs.genycaster.xyz/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/docs.genycaster.xyz/privkey.pem;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
 location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }
 location / { try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
