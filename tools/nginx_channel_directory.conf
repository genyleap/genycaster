# Include these fixed read-only locations inside the existing caster.genyleap.com
# HTTPS server{} block, then run nginx -t and reload Nginx.
# The active /etc/nginx configuration is managed separately and cannot be
# modified by a WASM deployment. No open proxy, client-selected upstream host,
# authentication header or browser-side cross-origin metadata fetch.

location = /api/channel-directory/search-channels {
    limit_except GET { deny all; }
    proxy_pass https://client.warpcast.com/v2/search-channels;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host client.warpcast.com;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 9s;
    proxy_buffering on;
    add_header Cache-Control "public, max-age=45" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /api/channel-directory/channel {
    limit_except GET { deny all; }
    proxy_pass https://client.warpcast.com/v2/channel;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host client.warpcast.com;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 9s;
    proxy_buffering on;
    add_header Cache-Control "public, max-age=120" always;
    add_header X-Content-Type-Options "nosniff" always;
}
