# Include inside the caster.genyleap.com TLS server block.
# Public metadata only, with no credentials and no arbitrary target URL.
location = /api/channel-directory/search-channels {
    limit_except GET { deny all; }
    proxy_pass https://client.warpcast.com/v2/search-channels;
    proxy_ssl_server_name on;
    proxy_set_header Host client.warpcast.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 9s;
    proxy_buffering on;
    add_header Cache-Control "public, max-age=45" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /api/channel-directory/channel {
    limit_except GET { deny all; }
    proxy_pass https://client.warpcast.com/v2/channel;
    proxy_ssl_server_name on;
    proxy_set_header Host client.warpcast.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 9s;
    proxy_buffering on;
    add_header Cache-Control "public, max-age=120" always;
    add_header X-Content-Type-Options "nosniff" always;
}
