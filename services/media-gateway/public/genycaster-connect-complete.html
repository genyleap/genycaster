<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Return to Genycaster</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui,-apple-system,sans-serif }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: Canvas; color: CanvasText; }
    main { width: min(25rem, calc(100% - 3rem)); text-align: center }
    h1 { font-size: 1.3rem; margin: .6rem 0 }
    p { opacity: .72; margin: .5rem 0 1.5rem }
    button { border: 0; border-radius: .8rem; padding: .8rem 1.3rem;
      color: white; background: #5850d6; font: inherit; cursor: pointer }
    button:focus-visible { outline: 3px solid #7cb7ff; outline-offset: 3px }
  </style>
</head>
<body>
  <main role="status">
    <h1>Return to Genycaster</h1>
    <p>The provider step has ended. Genycaster checks whether your account was linked.</p>
    <button type="button" id="close">Close this window</button>
  </main>
  <script>
    // The provider's COOP policy may sever the opener's WindowProxy.
    // Only this script-created popup can reliably close itself.
    document.getElementById('close').addEventListener('click', function() { window.close(); });
    const failed = new URLSearchParams(window.location.search).has('op_error');
    if (failed) {
      document.querySelector('h1').textContent = 'Connection not completed';
      document.querySelector('p').textContent =
        'The provider did not complete this connection. Return to Genycaster to try again.';
    } else {
      window.addEventListener('load', function() { window.close(); }, {once:true});
    }
  </script>
</body>
</html>
