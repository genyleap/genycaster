# Genycaster public health endpoint. Separate from the main WASM and Genyleap status hosts.
server {
    listen 80;
    listen [::]:80;
    server_name status.genycaster.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://status.genycaster.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status.genycaster.xyz;

    ssl_certificate /etc/letsencrypt/live/status.genycaster.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.genycaster.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/status.genycaster.xyz.access.log;
    error_log /var/log/nginx/status.genycaster.xyz.error.log;

    add_header Cache-Control "no-store, max-age=0" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /api/health {
        proxy_pass http://127.0.0.1:8798/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 7s;
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 1k;
    }

    # Until a branded human-readable status page is available,
    # the root documents the live API.
    location = / {
        return 302 /api/health;
    }
    location / {
        return 404;
    }
}
