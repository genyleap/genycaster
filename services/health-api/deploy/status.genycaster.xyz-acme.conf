# Temporary bootstrap vhost for ACME HTTP-01 validation.
# The installation script replaces this with the HTTPS vhost after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name status.genycaster.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
