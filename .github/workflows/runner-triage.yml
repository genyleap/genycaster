name: GenyCaster hosted runner triage
on:
  push:
    branches:
      - main
    paths:
      - 'ci/runner-triage-request.txt'
permissions:
  contents: read
jobs:
  ubuntu:
    name: Ubuntu runner triage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Ubuntu runner allocation
        run: echo "Linux runner started"; uname -m
  windows:
    name: Windows runner triage
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check Windows runner allocation
        shell: pwsh
        run: Write-Output "Windows runner started"
  macos:
    name: macOS runner triage
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check macOS runner allocation
        run: echo "macOS runner started"; uname -m
