name: GenyCaster runner availability probe

on:
  push:
    branches:
      - main
    paths:
      - ci/runner-probe-request.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Ubuntu runner startup probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove that GitHub provisioned a runner
        run: |
          echo "GenyCaster CI runner is available"
          uname -m
          echo "Commit: $GITHUB_SHA"
