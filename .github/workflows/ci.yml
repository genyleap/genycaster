name: GenyCaster cross-platform builds

# No branch pushes, pull requests, schedules or release edits trigger this workflow.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform (never publishes a Release)
        type: choice
        required: true
        default: all
        options:
          - all
          - core
          - linux
          - macos
          - windows
          - android
          - web
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Separate manual invocations by run ID; never serialize unrelated platform checks.
  # Version tags still serialize by ref to avoid overlapping releases.
  group: genycaster-cross-platform-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.12.0'
  CMAKE_VERSION: '4.4.4'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_API: '28'
  LANG: C.UTF-8

jobs:
  gate:
    name: Validate version and event
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        run: python3 ci/release_gate.py
      - name: Release commits must originate from main
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  core:
    name: Core C++26 tests
    needs: gate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'core'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Install GCC 16 and C++26 dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 ninja-build \
            libboost-dev libsqlite3-dev libssl-dev python3
          g++-16 --version
      - name: Build and run core tests
        shell: bash
        run: |
          set -euo pipefail
          export CC=gcc-16 CXX=g++-16
          cmake --preset core-release
          cmake --build --preset core-release --parallel 3
          ctest --test-dir build/core-release --output-on-failure --parallel 2
      - name: Architecture and CI checks
        run: |
          python3 ci/check_architecture.py
          python3 ci/verify_ci.py
          python3 -m unittest ci.test_pipeline -v

  linux:
    name: Linux x86_64 AppImage
    needs: gate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Install Linux build and deployment tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build curl file patchelf libfuse2 \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 \
            libboost-dev libsqlite3-dev libssl-dev libsecret-1-dev \
            libcurl4-openssl-dev libdbus-1-dev software-properties-common \
            libfontconfig1 libfreetype6 python3
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 lld
          ld.lld --version
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Verify Android icon rasterization and alpha preservation
        shell: bash
        run: |
          set -euo pipefail
          export CC=gcc-16 CXX=g++-16
          cmake -S tests/icon_raster -B build/icon-raster -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build/icon-raster --parallel 2
          ctest --test-dir build/icon-raster --output-on-failure
      - name: Build Qt client
        shell: bash
        run: |
          set -euo pipefail
          export CC=gcc-16 CXX=g++-16
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DFARCASTER_BUILD_TESTS=OFF \
            -DGENYCASTER_FETCH_QTKEYCHAIN=ON \
            -DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON
          # lld avoids expensive GNU ld final-link memory use for the large Qt/C++26 app.
          cmake --build build/native --target farcaster_client --parallel 2
          test -x build/native/bin/farcaster_client
      - name: Package AppImage
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/512x512/apps build/ci-linuxdeploy
          cp build/native/bin/farcaster_client AppDir/usr/bin/
          cp ui/wasm/genycaster-512.png \
            AppDir/usr/share/icons/hicolor/512x512/apps/genycaster.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' \
            'Name=GenyCaster' 'Exec=farcaster_client' \
            'Icon=genycaster' 'Categories=Network;' \
            > AppDir/usr/share/applications/genycaster.desktop
          curl --fail --location --retry 3 \
            -o build/ci-linuxdeploy/linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            -o build/ci-linuxdeploy/linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x build/ci-linuxdeploy/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/ui"
          # linuxdeploy discovers plugins via PATH as linuxdeploy-plugin-<name>.
          cp build/ci-linuxdeploy/linuxdeploy-plugin-qt.AppImage build/ci-linuxdeploy/linuxdeploy-plugin-qt
          chmod +x build/ci-linuxdeploy/linuxdeploy-plugin-qt
          export PATH="$PWD/build/ci-linuxdeploy:$PATH"
          export OUTPUT="GenyCaster-v${VERSION}-linux-x86_64.AppImage"
          ./build/ci-linuxdeploy/linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/genycaster.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/genycaster.png \
            --plugin qt --output appimage
          test -s "$OUTPUT"
          mv "$OUTPUT" dist/
          python3 ci/verify_platform_package.py linux "dist/$OUTPUT"
          (cd dist && sha256sum *.AppImage > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64 DMG
    needs: gate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Install macOS toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja llvm boost openssl@3 sqlite
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Build and deploy macOS application
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          export CC="$(brew --prefix llvm)/bin/clang"
          export CXX="$(brew --prefix llvm)/bin/clang++"
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DFARCASTER_BUILD_TESTS=OFF \
            -DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON
          cmake --build build/native --target farcaster_client --parallel 3
          APP=build/native/bin/farcaster_client.app
          test -d "$APP"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -dmg -verbose=1
          mkdir -p dist
          DMG=build/native/bin/farcaster_client.dmg
          test -s "$DMG"
          cp "$DMG" "dist/GenyCaster-v${VERSION}-macos-arm64.dmg"
          python3 ci/verify_platform_package.py macos "dist/GenyCaster-v${VERSION}-macos-arm64.dmg"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 portable ZIP
    needs: gate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install official Qt 6.12 MSVC archives
        shell: pwsh
        run: |
          choco install 7zip --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/install_qt_windows.py --destination Qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'genycaster-vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore built vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/genycaster-vcpkg-binary-cache
          key: genycaster-windows-vcpkg-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            genycaster-windows-vcpkg-
      - name: Install Windows native packages
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            boost-asio:x64-windows boost-beast:x64-windows boost-json:x64-windows `
            boost-multiprecision:x64-windows boost-property-tree:x64-windows `
            boost-system:x64-windows curl:x64-windows openssl:x64-windows sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify required native headers before C++26 scanning
        shell: pwsh
        run: |
          $include = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include"
          $headers = @(
            'boost/json/src.hpp', 'boost/multiprecision/cpp_int.hpp',
            'boost/asio.hpp', 'boost/beast.hpp',
            'boost/property_tree/json_parser.hpp', 'boost/system/error_code.hpp',
            'curl/curl.h', 'sqlite3.h'
          )
          foreach ($header in $headers) {
            $file = Join-Path $include $header
            if (-not (Test-Path $file)) { throw "Windows CI dependency missing: $file" }
          }
      - name: Compile and deploy
        shell: pwsh
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # Qt's MSVC ABI is supported by Clang-CL. MSVC 19.44 cannot
          # satisfy CMake's CXX26 feature requirement; never lower C++26.
          $llvm = "$env:ProgramFiles/LLVM/bin"
          $clang = Join-Path $llvm 'clang-cl.exe'
          $scanner = Join-Path $llvm 'clang-scan-deps.exe'
          if (-not (Test-Path $clang)) { throw 'Clang-CL not available on runner' }
          if (-not (Test-Path $scanner)) { throw 'Clang module scanner not available on runner' }
          & $clang --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build/native -G Ninja `
            "-DCMAKE_C_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=$scanner" `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DFARCASTER_BUILD_TESTS=OFF" `
            "-DGENYCASTER_FETCH_QTKEYCHAIN=ON" `
            "-DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native --target farcaster_client --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/app | Out-Null
          Copy-Item build/native/bin/farcaster_client.exe dist/app/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release `
            --qmldir ui --dir dist/app dist/app/farcaster_client.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # windeployqt bundles Qt but not the non-Qt vcpkg dependency tree.
          # Bundle all DLLs from this build's isolated vcpkg target triplet:
          # libcurl, SQLite and OpenSSL have their own transitive dependencies.
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $runtimeDlls = @(Get-ChildItem $vcpkgBin -File -Filter '*.dll')
          foreach ($pattern in @('libcrypto*.dll', 'libssl*.dll', '*sqlite*.dll', '*curl*.dll')) {
            if (@($runtimeDlls | Where-Object { $_.Name -like $pattern }).Count -eq 0) {
              throw "Required Windows runtime dependency not found: $pattern"
            }
          }
          foreach ($dll in $runtimeDlls) {
            Copy-Item $dll.FullName dist/app/ -ErrorAction Stop
          }
          $keychain = Get-ChildItem build/native -Recurse -File -Filter '*keychain*.dll' |
            Select-Object -First 1
          if (-not $keychain) { throw 'Missing QtKeychain runtime DLL' }
          Copy-Item $keychain.FullName dist/app/
          $zip = "dist/GenyCaster-v$env:VERSION-windows-x86_64.zip"
          Compress-Archive -Path dist/app/* -DestinationPath $zip
          if (-not (Test-Path $zip)) { throw "Windows ZIP missing" }
          python ci/verify_platform_package.py windows $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" |
            Set-Content -Encoding ascii dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64 APK
    needs: gate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Verify Android OpenSSL and Qt Network TLS gates
        run: |
          cmake -P tests/cmake/android_openssl_root_test.cmake
          cmake -P tests/cmake/android_qt_tls_test.cmake
      - name: Install Android packages and OpenSSL tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf perl \
            libdigest-sha-perl make curl tar python3
          # Android SDK command-line tools live under cmdline-tools, not
          # the project ci/ directory. Guard this path before sdkmanager.
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$sdkmanager_bin/sdkmanager" || {
            echo "::error::Android sdkmanager missing: $sdkmanager_bin/sdkmanager"
            exit 1
          }
          export PATH="$sdkmanager_bin:$PATH"
          echo "$sdkmanager_bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-${ANDROID_API}" "build-tools;35.0.0" \
            "platform-tools"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true
      - name: Reject Android SDKs without Qt Network TLS
        shell: bash
        run: |
          set -euo pipefail
          config="$QT_ROOT_DIR/include/QtNetwork/qtnetwork-config.h"
          test -r "$config" || { echo "::error::Missing Qt Network feature configuration: $config"; exit 1; }
          grep -E '^#define QT_FEATURE_ssl[[:space:]]+' "$config" || true
          if ! grep -Eq '^#define QT_FEATURE_ssl[[:space:]]+1([[:space:]]|$)' "$config"; then
            echo "::error::Qt for Android has SSL disabled; GenyCaster HTTPS transports are fail-closed"
            exit 1
          fi
      # Qt for Android ships the TLS backend, not OpenSSL runtime binaries.
      # Build the pinned Android ABI libraries inside CI, as part of the
      # platform job (no developer-machine bootstrap scripts).
      - name: Prepare Android OpenSSL 3.5.9 libraries
        shell: bash
        run: |
          set -euo pipefail
          version=3.5.9
          url="https://github.com/openssl/openssl/releases/download/openssl-${version}/openssl-${version}.tar.gz"
          work="$RUNNER_TEMP/genycaster-android-openssl"
          mkdir -p "$work" build/android-deps/include build/android-deps/lib
          curl --fail --location --retry 3 --silent --show-error \
            "$url" -o "$work/openssl-${version}.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "${url}.sha256" -o "$work/openssl-${version}.tar.gz.sha256"
          expected="$(awk 'NR==1 {print $1}' "$work/openssl-${version}.tar.gz.sha256")"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid OpenSSL SHA-256"; exit 1; }
          echo "$expected  $work/openssl-${version}.tar.gz" | sha256sum --check --status
          tar -xzf "$work/openssl-${version}.tar.gz" -C "$work"

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          toolchain="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$toolchain:$PATH"
          (
            cd "$work/openssl-${version}"
            # NDK r27 defaults to 4 KiB ELF segments. Android 15+ may use
            # 16 KiB pages; OpenSSL must match the Qt and provider binaries.
            export LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            ./Configure android-arm64 shared no-tests -D__ANDROID_API__="${ANDROID_API}"
            make -s -j 4 SHLIB_VERSION_NUMBER= build_libs
            test -s libcrypto.so
            test -s libssl.so
            cp -R include/openssl "$GITHUB_WORKSPACE/build/android-deps/include/"
            cp -L libcrypto.so "$GITHUB_WORKSPACE/build/android-deps/lib/libcrypto_3.so"
            cp -L libssl.so "$GITHUB_WORKSPACE/build/android-deps/lib/libssl_3.so"
          )
          libdir="$GITHUB_WORKSPACE/build/android-deps/lib"
          patchelf --set-soname libcrypto_3.so "$libdir/libcrypto_3.so"
          patchelf --set-soname libssl_3.so "$libdir/libssl_3.so"
          for needed in libcrypto.so libcrypto.so.3; do
            if patchelf --print-needed "$libdir/libssl_3.so" | grep -Fqx "$needed"; then
              patchelf --replace-needed "$needed" libcrypto_3.so "$libdir/libssl_3.so"
            fi
          done
          patchelf --print-needed "$libdir/libssl_3.so" | grep -Fqx libcrypto_3.so
          for lib in libcrypto_3.so libssl_3.so; do
            "$toolchain/llvm-readelf" -h "$libdir/$lib" | grep -Eq 'Machine:[[:space:]]+AArch64'
          done
          test -s build/android-deps/include/openssl/opensslv.h
          echo "Android ARM64 OpenSSL ${version} verified for APK deployment"
      - name: Prepare signing for release tags only
        if: needs.gate.outputs.release == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo "::error::Android signing secrets are missing"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/genycaster-release.keystore"
          test -s "$RUNNER_TEMP/genycaster-release.keystore"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/genycaster-release.keystore" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Configure and build Android APK
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SIGN_RELEASE: ${{ needs.gate.outputs.release }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          args=(
            -S . -B build/android -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            "-DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            "-DQT_HOST_PATH=$QT_HOST_PATH"
            -DANDROID_ABI=arm64-v8a
            "-DANDROID_PLATFORM=android-${ANDROID_API}"
            "-DANDROID_SDK_ROOT=$ANDROID_HOME"
            "-DANDROID_NDK=$ANDROID_NDK_ROOT"
            "-DGENYCASTER_ANDROID_OPENSSL_ROOT=$PWD/build/android-deps"
            -DFARCASTER_BUILD_TESTS=OFF
            -DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON
            -DQT_ANDROID_DEPLOY_RELEASE=ON
          )
          if [[ "$SIGN_RELEASE" == true ]]; then
            args+=(
              -DQT_ANDROID_SIGN_APK=ON
              "-DQT_ANDROID_KEYSTORE_PATH=$QT_ANDROID_KEYSTORE_PATH"
              "-DQT_ANDROID_KEYSTORE_ALIAS=$QT_ANDROID_KEYSTORE_ALIAS"
              "-DQT_ANDROID_KEYSTORE_STORE_PASS=$QT_ANDROID_KEYSTORE_STORE_PASS"
              "-DQT_ANDROID_KEYSTORE_KEY_PASS=$QT_ANDROID_KEYSTORE_KEY_PASS"
            )
          fi
          # Qt Network SSL feature was verified before OpenSSL packaging.
          cmake "${args[@]}"
          cmake --build build/android --target farcaster_client_make_apk --parallel 3
          mkdir -p dist
          # Qt's deploy step may produce a native APK and a Gradle APK.
          # Never select arbitrarily from 'find *.apk' or package Debug.
          output_dir=build/android/ui/android-build/build/outputs/apk/release
          if [[ "$SIGN_RELEASE" == true ]]; then
            mapfile -t apks < <(find "$output_dir" -maxdepth 1 -type f \
              -name '*-signed.apk' ! -name '*unsigned*' | sort)
          else
            apks=("$output_dir/android-build-release-unsigned.apk")
          fi
          if [[ ${#apks[@]} -ne 1 || ! -s "${apks[0]}" ]]; then
            echo "::error::Expected one release APK under $output_dir"
            find build/android/ui -name '*.apk' -print
            exit 1
          fi
          # Every published CI artifact must be installable. A manually
          # dispatched build gets a throwaway test signature, never the
          # protected release key. Only a version tag uses release secrets.
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$signer" || { echo "::error::Missing Android apksigner"; exit 1; }
          selected="${apks[0]}"
          if [[ "$SIGN_RELEASE" != true ]]; then
            test_keystore="$RUNNER_TEMP/genycaster-ci-test.p12"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$test_keystore" -alias genycaster-ci-test \
              -keyalg RSA -keysize 3072 -validity 2 \
              -storepass genycaster-ci-ephemeral -keypass genycaster-ci-ephemeral \
              -dname "CN=GenyCaster CI Test APK, OU=Not For Release"
            selected="$RUNNER_TEMP/genycaster-ci-test-signed.apk"
            "$signer" sign --ks "$test_keystore" \
              --ks-key-alias genycaster-ci-test \
              --ks-pass pass:genycaster-ci-ephemeral \
              --key-pass pass:genycaster-ci-ephemeral \
              --out "$selected" "${apks[0]}"
            echo "WARNING: Android manual artifact uses an ephemeral CI TEST key."
            echo "It is installable for testing, NOT an official release signature."
          fi
          "$signer" verify --verbose --print-certs "$selected"
          # An APK can pass signing and all CMake checks while failing the
          # native loader on devices with 16 KiB pages.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$selected"
          artifact="dist/GenyCaster-v${VERSION}-android-arm64-v8a.apk"
          if [[ "$SIGN_RELEASE" != true ]]; then
            artifact="dist/GenyCaster-v${VERSION}-android-arm64-v8a-CI-TEST.apk"
          fi
          cp "$selected" "$artifact"
          python3 ci/verify_platform_package.py android "$artifact"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-android-arm64-v8a
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  web:
    name: WebAssembly (single-threaded)
    needs: gate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'web'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '5.0.5'
          actions-cache-folder: emsdk-cache
      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
      - name: Install host Qt ShaderTools (qsb for cross-build)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: wasm
          arch: wasm_singlethread
          cache: true
      - name: Build Qt Multimedia WebAssembly tech-preview from verified source
        shell: bash
        run: bash ci/build_qt_wasm_multimedia.sh
      - name: Build and package browser application
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          cmake -S . -B build/web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DQT_HOST_PATH=$QT_HOST_PATH" \
            -DFARCASTER_BUILD_TESTS=OFF
          cmake --build build/web --target genycaster_wasm_asset_refresh --parallel 3
          mkdir -p dist
          python3 ci/package_web.py \
            --source build/web/bin \
            --output "dist/GenyCaster-v${VERSION}-web-wasm.tar.gz"
          python3 ci/verify_platform_package.py web "dist/GenyCaster-v${VERSION}-web-wasm.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-web-wasm
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish version-tag release
    needs: [gate, core, linux, macos, windows, android, web]
    if: github.event_name == 'push' && needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse overwriting an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify mandatory packages and aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          for name in GenyCaster-linux-x86_64 GenyCaster-macos-arm64 \
                      GenyCaster-windows-x86_64 GenyCaster-android-arm64-v8a \
                      GenyCaster-web-wasm; do
            test -d "artifacts/$name"
            test -n "$(find "artifacts/$name" -type f -print -quit)"
          done
          python3 ci/release_artifacts.py artifacts release
      - name: Publish as prerelease until device/signing verification
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GenyCaster ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: release/*
          fail_on_unmatched_files: true
