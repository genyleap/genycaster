name: GenyCaster cross-platform builds

# Only manual invocations and version-tag pushes trigger cross-platform builds.
# Never run the full matrix for ordinary commits or pull requests.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform (never publishes a Release)
        type: choice
        required: true
        default: web
        options:
          - all
          - linux
          - macos
          - windows
          - android
          - web
          - ios
          - nixos
      target_arch:
        description: Optional architecture filter for a single-platform validation
        type: choice
        required: false
        default: all
        options:
          - all
          - x86_64
          - arm64
      confirm_full_matrix:
        description: Confirm costly all-platform build (uses multiple macOS/Windows runners)
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Repeat dispatches for the same ref/platform supersede earlier manual runs.
  # Never cancel tag-triggered release jobs and never overlap unrelated platforms.
  group: genycaster-cross-platform-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'tag' }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_arch || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  QT_VERSION: '6.12.0'
  CMAKE_VERSION: '4.4.4'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_API: '28'
  LANG: C.UTF-8

jobs:
  gate:
    name: Validate version and event
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        run: python3 ci/release_gate.py
      - name: Validate secure deployment configuration and URL boundaries
        run: |
          python3 -m unittest ci/test_deployment_config.py ci/test_audit_windows_stage.py ci/test_native_runtime_audits.py ci/test_nsis_cpack_config.py ci/test_packaging.py ci/test_linux_cpp_runtime.py ci/test_linux_release_parity.py ci/test_linux_distro_assets.py ci/test_macos_otool_headers.py ci/test_release_feature_contract.py ci/test_release_workflow_integrity.py ci/test_macos_signing_policy.py ci/test_platform_arm64_dispatch.py
          python3 ci/check_deployment_boundaries.py
          python3 ci/check_media_upload_contract.py
          node --test services/test/deployment_config.test.mjs
      # Gate is the only job that must pass before Qt/toolchain installations.
      # Catch known source regressions while they cost seconds, not macOS hours.
      - name: Confirm explicit full-matrix budget approval
        if: github.event_name == 'workflow_dispatch' && inputs.platform == 'all'
        env:
          GENYCASTER_FULL_MATRIX_CONFIRMED: ${{ inputs.confirm_full_matrix }}
        shell: bash
        run: |
          if [[ "$GENYCASTER_FULL_MATRIX_CONFIRMED" != "true" ]]; then
            echo "::error::All-platform build requires the full-matrix budget checkbox."
            exit 1
          fi
      - name: Refuse a partial cross-platform feature release
        if: steps.release.outputs.release == 'true'
        run: python3 ci/verify_release_feature_contract.py --strict
      - name: Release commits must originate from main
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  linux:
    name: Linux AppImage and DEB
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' && inputs.target_arch == 'x86_64' && '[{"arch":"x86_64","runner":"ubuntu-24.04","qt_arch":"linux_gcc_64","appimage_arch":"x86_64"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' && inputs.target_arch == 'arm64' && '[{"arch":"arm64","runner":"ubuntu-24.04-arm","qt_arch":"linux_gcc_arm64","appimage_arch":"aarch64"}]' || '[{"arch":"x86_64","runner":"ubuntu-24.04","qt_arch":"linux_gcc_64","appimage_arch":"x86_64"},{"arch":"arm64","runner":"ubuntu-24.04-arm","qt_arch":"linux_gcc_arm64","appimage_arch":"aarch64"}]') }}
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Install Linux build and deployment tools
        shell: bash
        run: |
          set -euo pipefail
          # Probe Ubuntu mirrors before APT. The runner previously spent
          # 17 minutes retrying an unresolvable ports.ubuntu.com hostname.
          # ci/prepare_ubuntu_apt.sh keeps Ubuntu's signed archive policy.
          bash ci/prepare_ubuntu_apt.sh
          sudo timeout 240s apt-get install -y \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=12 \
            -o Acquire::https::Timeout=12 \
            curl file patchelf libfuse2 zsync \
            libgl1 libegl1 libgl1-mesa-dev libopengl-dev libglx-dev libegl-dev libx11-dev \
            libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxcb-randr0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxcb-glx0 libxcb-xinput0 \
            libxcb-render0 libxcb-util1 libx11-xcb1 libxcb-dri3-0 \
            libice6 libsm6 libxrandr2 \
            libboost-dev libsqlite3-dev libssl-dev libsecret-1-dev \
            libcurl4-openssl-dev libdbus-1-dev \
            libfontconfig1 libfreetype6 libgstreamer-plugins-bad1.0-0 \
            libgstreamer-plugins-good1.0-0 libpulse0 libasound2t64 \
            libminizip1t64 libsnappy1v5 libwebp7 libwebpdemux2 libwebpmux3 \
            libnss3 libnspr4 libxfixes3 libxdamage1 libxcomposite1 \
            liblcms2-2 libxtst6 libxkbfile1 \
            desktop-file-utils python3 python3-venv
          # Avoid Launchpad's REST API: ARM runners intermittently have
          # no route to it even when apt mirrors are reachable. Validate the
          # actual PPA key fingerprint and use a signed apt source directly.
          bash ci/install_linux_gcc16.sh
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # Qt WebEngine 6.140 is a separate extension, unavailable via
          # the ordinary Qt 6.12 addons list; do not break proven release CI.
          modules: qtmultimedia
          cache: true
      - name: Install Qt 6.12 Linux WebEngine extension and WebChannel
        shell: bash
        run: |
          set -euo pipefail
          # Qt 6.140 WebEngine is distributed separately from the regular
          # Qt 6.12 modules. aqt resolves the official 6.12 SDK extension
          # metadata; merging at the Qt installation root preserves ABI.
          python3 -m venv build/ci-aqt
          build/ci-aqt/bin/python -m pip install 'aqtinstall==3.3.0'
          qt_base="$(dirname "$(dirname "$QT_ROOT_DIR")")"
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            host=linux_arm64
          else
            host=linux
          fi
          build/ci-aqt/bin/aqt install-qt "$host" desktop "${{ env.QT_VERSION }}" \
            "${{ matrix.qt_arch }}" \
            --modules qtwebchannel qtpositioning qtserialport qtwebengine \
            --noarchives --outputdir "$qt_base"
          python3 ci/preflight_linux_miniapp_host.py --qt-root "$QT_ROOT_DIR"
      - name: Check Qt Multimedia deployment dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The official Qt 6.12 Linux x86_64 archive can ship only FFmpeg;
          # ARM64 may also ship GStreamer. Require at least one usable backend
          # and inspect the actual ELF dependencies rather than a hardcoded
          # optional plugin or legacy GStreamer SONAME.
          multimedia="$QT_ROOT_DIR/plugins/multimedia"
          usable=0
          for backend in ffmpeg gstreamer; do
            plugin="$multimedia/lib${backend}mediaplugin.so"
            if [[ ! -f "$plugin" ]]; then
              echo "::notice::Optional Qt $backend backend not present"
              continue
            fi
            missing="$(ldd "$plugin" | grep "not found" || true)"
            if [[ -n "$missing" ]]; then
              echo "::warning::Qt $backend backend missing runtime libraries: $missing"
              continue
            fi
            echo "Qt $backend media backend dependencies resolved"
            usable=$((usable + 1))
          done
          if (( usable < 1 )); then
            echo "::error::No usable Qt Multimedia backend found in $multimedia"
            exit 1
          fi
      - name: Preflight Qt XCB QML TLS and multimedia runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/preflight_linux_qt_runtime.py --qt-root "$QT_ROOT_DIR"
      - name: Check Qt WebEngine process and library dependencies
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for binary in "$QT_ROOT_DIR/libexec/QtWebEngineProcess" \
                        "$QT_ROOT_DIR/lib/libQt6WebEngineCore.so.6"; do
            test -f "$binary"
            missing="$(ldd "$binary" 2>&1 | grep -E 'not found|version .* not found' || true)"
            if [[ -n "$missing" ]]; then
              echo "::error::Missing Qt WebEngine runtime dependency: $binary: $missing"
              exit 1
            fi
          done
      - name: Build Qt client
        shell: bash
        run: |
          set -euo pipefail
          export CC=gcc-16 CXX=g++-16
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DFARCASTER_BUILD_TESTS=OFF \
            -DFARCASTER_ENABLE_MINIAPPS=ON \
            -DGENYCASTER_REQUIRE_LINUX_MINIAPP_HOST=ON \
            -DGENYCASTER_FETCH_QTKEYCHAIN=ON \
            -DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON
          # Strict CI release features: never silently omit the native host.
          grep -q '^FARCASTER_ENABLE_MINIAPPS:BOOL=ON$' build/native/CMakeCache.txt
          grep -q '^GENYCASTER_REQUIRE_LINUX_MINIAPP_HOST:BOOL=ON$' build/native/CMakeCache.txt
          cmake --build build/native --target farcaster_miniapp_browser --parallel 2
          # lld reduces peak memory pressure for the large C++26 Qt executable.
          cmake --build build/native --target genycaster --parallel 2
          test -x build/native/bin/Genycaster
      - name: Package AppImage
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/512x512/apps build/ci-linuxdeploy
          cp build/native/bin/Genycaster AppDir/usr/bin/
          # Copy Chromium's subprocess and immutable resources into the AppDir
          # before linuxdeploy so its ELF dependency walker can see them.
          python3 ci/stage_linux_webengine.py AppDir --qt-root "$QT_ROOT_DIR"
          # Bundle the native zsync CLI for optional HTTP Range/block-delta
          # updates. Never depend on its presence in a user's Linux distro.
          install -m 755 /usr/bin/zsync AppDir/usr/bin/zsync
          mkdir -p AppDir/usr/share/doc/genycaster
          cp /usr/share/doc/zsync/copyright AppDir/usr/share/doc/genycaster/zsync-copyright
          test -x AppDir/usr/bin/zsync
          cp properties/Linux/genycaster.png \
            AppDir/usr/share/icons/hicolor/512x512/apps/genycaster.png
          cp properties/Linux/genycaster.desktop \
            AppDir/usr/share/applications/genycaster.desktop
          desktop-file-validate AppDir/usr/share/applications/genycaster.desktop
          curl --fail --location --retry 3 \
            -o build/ci-linuxdeploy/linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage
          curl --fail --location --retry 3 \
            -o build/ci-linuxdeploy/linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.appimage_arch }}.AppImage
          chmod +x build/ci-linuxdeploy/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/ui"
          # linuxdeploy discovers plugins via PATH as linuxdeploy-plugin-<name>.
          cp build/ci-linuxdeploy/linuxdeploy-plugin-qt.AppImage build/ci-linuxdeploy/linuxdeploy-plugin-qt
          chmod +x build/ci-linuxdeploy/linuxdeploy-plugin-qt
          export PATH="$PWD/build/ci-linuxdeploy:$PATH"
          export OUTPUT="GenyCaster-v${VERSION}-linux-${{ matrix.arch }}.AppImage"
          # First deploy the Qt runtime into AppDir without sealing an
          # AppImage. The Qt plugin can include unused SQL drivers; trim them
          # before packaging, while preserving QML/Basic/Multimedia plugins.
          ./build/ci-linuxdeploy/linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/genycaster.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/genycaster.png \
            --plugin qt
          python3 ci/prune_linux_qt_plugins.py AppDir
          # linuxdeploy blacklists libstdc++ even when GCC 16 requires a
          # newer GLIBCXX symbol than stock Ubuntu 24.04 provides. Bundle
          # ONLY the matching compiler runtime and launch against it.
          python3 ci/bundle_linux_cpp_runtime.py AppDir --compiler g++-16
          # QtNetwork dlopens libssl/libcrypto and its TLS plugin: linuxdeploy
          # cannot discover them from the executable's DT_NEEDED list.
          python3 ci/bundle_linux_tls_runtime.py AppDir --qt-root "$QT_ROOT_DIR"
          python3 ci/bundle_linux_webengine_runtime.py AppDir --qt-root "$QT_ROOT_DIR"
          python3 ci/audit_linux_appdir.py AppDir --require-miniapps
          # Seal the audited runtime, not the unfiltered Qt plugin output.
          ./build/ci-linuxdeploy/linuxdeploy.AppImage \
            --appdir AppDir --output appimage
          # Recheck that the final sealing pass did not replace the launcher
          # or remove the target GCC 16 runtime.
          python3 ci/audit_linux_appdir.py AppDir --require-miniapps
          test -s "$OUTPUT"
          mv "$OUTPUT" dist/
          python3 ci/verify_platform_package.py linux "dist/$OUTPUT"
          # zsync uses checksums of existing AppImage blocks to fetch only
          # changed blocks. It is a real delta transport for Linux, not a
          # duplicate full-application update file.
          zsyncmake -u "https://github.com/genyleap/genycaster/releases/download/v${VERSION}/$OUTPUT" \
            -o "dist/$OUTPUT.zsync" "dist/$OUTPUT"
          test -s "dist/$OUTPUT.zsync"
          # Native Debian installation alongside the no-install AppImage.
          # Both contain the same linuxdeploy Qt/QML and C++ runtime tree.
          python3 ci/package_linux_deb.py --appdir AppDir --output dist \
            --version "$VERSION" --arch "${{ matrix.arch }}"
          python3 ci/verify_platform_package.py linux-deb \
            "dist/GenyCaster-v${VERSION}-linux-${{ matrix.arch }}.deb"
          # Fresh Ubuntu container: no developer Qt installation, no Qt SDK
          # environment. Validate the actual installed Debian runtime.
          bash ci/smoke_linux_install.sh \
            "dist/GenyCaster-v${VERSION}-linux-${{ matrix.arch }}.deb" \
            "dist/$OUTPUT"
          (cd dist && sha256sum *.AppImage *.deb > SHA256SUMS)
      - name: Upload Linux rendering diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-linux-render-diagnostics-${{ matrix.arch }}
          path: build/ci-linux-render-diagnostics/*.png
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'macos' && inputs.target_arch == 'x86_64' && '[{"arch":"x86_64","runner":"macos-26-intel"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'macos' && inputs.target_arch == 'arm64' && '[{"arch":"arm64","runner":"macos-26"}]' || '[{"arch":"arm64","runner":"macos-26"},{"arch":"x86_64","runner":"macos-26-intel"}]') }}
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Install macOS toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          # OpenSSL is built separately from pinned source for macOS 15;
          # do not link Homebrew bottles targeting the macOS 26 runner.
          brew install ninja llvm boost sqlite
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Build OpenSSL 3.5.9 for macOS 15 deployment
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew bottles on macos-26 can contain object files with a
          # minimum OS of 26.0. They are unsuitable for a macOS 15 target.
          # Use the verified upstream source and the target architecture.
          OPENSSL_VERSION=3.5.9
          OPENSSL_SHA256=603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
          mkdir -p build/ci-openssl
          ARCHIVE="$PWD/build/ci-openssl/openssl-${OPENSSL_VERSION}.tar.gz"
          curl --fail --location --retry 3 \
            --output "$ARCHIVE" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          printf '%s  %s\n' "$OPENSSL_SHA256" "$ARCHIVE" | shasum -a 256 --check
          tar -xzf "$ARCHIVE" -C build/ci-openssl
          cd "build/ci-openssl/openssl-${OPENSSL_VERSION}"
          export CC="$(xcrun --sdk macosx --find clang)"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          test -f "$SDKROOT/usr/include/stdlib.h"
          export MACOSX_DEPLOYMENT_TARGET=15.0
          export CFLAGS="-O2 -mmacosx-version-min=15.0 -isysroot $SDKROOT"
          export LDFLAGS="-mmacosx-version-min=15.0 -isysroot $SDKROOT"
          # The macOS 26 hosted runner does not reliably expose the target
          # SDK's standard C headers unless clang receives its explicit sysroot.
          ./Configure "darwin64-${{ matrix.arch }}-cc" no-shared no-tests \
            --prefix="$GITHUB_WORKSPACE/build/ci-openssl/install" \
            --openssldir="$GITHUB_WORKSPACE/build/ci-openssl/install/ssl"
          make -j3
          make install_sw
          test -s "$GITHUB_WORKSPACE/build/ci-openssl/install/lib/libcrypto.a"
          test -s "$GITHUB_WORKSPACE/build/ci-openssl/install/lib/libssl.a"
      - name: Build and deploy macOS application
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          REQUIRE_MACOS_NOTARIZATION: ${{ needs.gate.outputs.release }}
        run: |
          set -euo pipefail
          export CC="$(brew --prefix llvm)/bin/clang"
          export CXX="$(brew --prefix llvm)/bin/clang++"
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/build/ci-openssl/install" \
            -DOPENSSL_INCLUDE_DIR="$GITHUB_WORKSPACE/build/ci-openssl/install/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$GITHUB_WORKSPACE/build/ci-openssl/install/lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$GITHUB_WORKSPACE/build/ci-openssl/install/lib/libssl.a" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DFARCASTER_BUILD_TESTS=OFF \
            -DFARCASTER_ENABLE_MINIAPPS=ON \
            -DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON || {
              echo "::error::macOS CMake configuration failed; SDK probe details:"
              if [[ -f build/native/CMakeFiles/CMakeConfigureLog.yaml ]]; then
                tail -n 220 build/native/CMakeFiles/CMakeConfigureLog.yaml
              fi
              exit 1
            }
          # CMake must link our macOS-15 static libraries, never a
          # Homebrew bottle built with a newer deployment target.
          OPENSSL_STAGE="$GITHUB_WORKSPACE/build/ci-openssl/install/lib"
          # -D variables may be cached as FILEPATH or UNINITIALIZED; compare
          # their resolved values, not the incidental CMake cache type.
          test "$(sed -n 's/^OPENSSL_CRYPTO_LIBRARY:[^=]*=//p' build/native/CMakeCache.txt)" = "$OPENSSL_STAGE/libcrypto.a"
          test "$(sed -n 's/^OPENSSL_SSL_LIBRARY:[^=]*=//p' build/native/CMakeCache.txt)" = "$OPENSSL_STAGE/libssl.a"
          grep -q '^FARCASTER_ENABLE_MINIAPPS:BOOL=ON$' build/native/CMakeCache.txt
          cmake --build build/native --target farcaster_miniapp_browser --parallel 3
          cmake --build build/native --target genycaster --parallel 3
          APP=build/native/bin/Genycaster.app
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist")" = Genycaster
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")" = Genycaster
          test -n "$(find build/native/bin -maxdepth 1 -type d -name 'Genycaster.app' -print -quit)"
          # Fail if a cross-architecture Qt library or toolchain leaked in.
          /usr/bin/lipo "$APP/Contents/MacOS/Genycaster" -verify_arch "${{ matrix.arch }}"
          # Qt's SDK ships SQL drivers for PostgreSQL, ODBC, Mimer etc.
          # GenyCaster uses its native SQLite storage and never links QtSql.
          # macdeployqt has no selective SQL-plugin switch, so hide ONLY the
          # unused SDK sqldrivers before it scans/copies plugins. Do not copy
          # missing system libpq/libiodbc or relax the dependency audit.
          SQL_DRIVERS="$QT_ROOT_DIR/plugins/sqldrivers"
          if [[ -d "$SQL_DRIVERS" ]]; then
            mv "$SQL_DRIVERS" "$RUNNER_TEMP/genycaster-unused-qt-sqldrivers"
          fi
          # Deploy first; macdeployqt may add QtSql even with sqldrivers
          # hidden. Inspect every shipped Mach-O dependency before removing
          # unused QtSql, and do not let a second deployment repopulate it.
          # Qt's deployment scanner walks every QML file under -qmldir.
          # Exclude Linux-only QtWebEngine Quick and Android-only WebView so
          # a native macOS WKWebView build never acquires another platform's
          # Qt WebEngine plugin requirements.
          QML_SCAN="$RUNNER_TEMP/genycaster-macos-qml-scan"
          mkdir -p "$QML_SCAN"
          rsync -a --include='*/' --include='*.qml' --include='*.js' \
            --include='qmldir' --exclude='*' "$GITHUB_WORKSPACE/ui/" "$QML_SCAN/"
          rm -f "$QML_SCAN/app/miniapp/EmbeddedBrowser.qml"
          rm -f "$QML_SCAN/components/apps/AndroidWebView.qml"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -qmldir="$QML_SCAN" -verbose=1
          python3 ci/prune_macos_bundle.py "$APP" --qml-source "$GITHUB_WORKSPACE/ui"
          # Re-sign the *final* macdeployqt/pruned bundle. GenyConnect uses
          # ad-hoc re-signing for experimental CI; it does not establish
          # Developer ID trust for a quarantined Safari download.
          signing_mode="ad-hoc"
          if [[ -n "$MACOS_DEVELOPER_ID_P12_BASE64" &&
                -n "$MACOS_DEVELOPER_ID_P12_PASSWORD" &&
                -n "$MACOS_NOTARY_KEY_P8_BASE64" &&
                -n "$MACOS_NOTARY_KEY_ID" &&
                -n "$MACOS_NOTARY_ISSUER_ID" ]]; then
            signing_mode="developer-id"
          elif [[ -n "$MACOS_DEVELOPER_ID_P12_BASE64" ||
                  -n "$MACOS_DEVELOPER_ID_P12_PASSWORD" ||
                  -n "$MACOS_NOTARY_KEY_P8_BASE64" ||
                  -n "$MACOS_NOTARY_KEY_ID" ||
                  -n "$MACOS_NOTARY_ISSUER_ID" ]]; then
            echo "::error::Incomplete macOS Developer ID/notarization secrets"
            exit 1
          fi
          if [[ "$REQUIRE_MACOS_NOTARIZATION" == "true" && "$signing_mode" != "developer-id" ]]; then
            echo "::error::Public macOS release requires Developer ID and Apple notarization"
            exit 1
          fi
          bash ci/sign_macos_bundle.sh "$APP" "$signing_mode"
          python3 ci/audit_macos_bundle.py "$APP" "${{ matrix.arch }}" --smoke
          mkdir -p dist
          DMG=build/native/bin/Genycaster.dmg
          # Seal EXACTLY the audited application. macdeployqt -dmg would
          # run deployment again and re-introduce optional SDK frameworks.
          hdiutil create -ov -volname GenyCaster -srcfolder "$APP" -format UDZO "$DMG"
          test -s "$DMG"
          hdiutil verify "$DMG"
          if [[ "$signing_mode" == "developer-id" ]]; then
            bash ci/notarize_macos_dmg.sh "$DMG"
          else
            echo "::warning::macOS CI DMG is ad-hoc signed, not notarized. Gatekeeper may block Safari downloads; this is not a public release."
          fi
          # Inspect and run the ACTUAL mounted DMG payload, not just the build
          # tree; this catches incomplete DMG copies and Qt SDK fallbacks.
          MOUNT="$RUNNER_TEMP/genycaster-dmg-${{ matrix.arch }}"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          test -d "$MOUNT/Genycaster.app"
          python3 ci/audit_macos_bundle.py "$MOUNT/Genycaster.app" "${{ matrix.arch }}" --smoke
          codesign --verify --deep --strict --verbose=4 "$MOUNT/Genycaster.app"
          if [[ "$signing_mode" == "developer-id" ]]; then
            spctl --assess --type execute --verbose=4 "$MOUNT/Genycaster.app"
            xcrun stapler validate "$DMG"
          fi
          hdiutil detach "$MOUNT"
          trap - EXIT
          suffix=""
          if [[ "$signing_mode" == "ad-hoc" ]]; then suffix="-adhoc-UNNOTARIZED"; fi
          cp "$DMG" "dist/GenyCaster-v${VERSION}-macos-${{ matrix.arch }}${suffix}.dmg"
          python3 ci/verify_platform_package.py macos "dist/GenyCaster-v${VERSION}-macos-${{ matrix.arch }}${suffix}.dmg"
          # Independent runtime snapshot for an eventual supervised updater.
          # Not advertised to the current UpdateController as an installer.
          python3 ci/package_selfupdate.py --platform macos \
            --arch "${{ matrix.arch }}" --version "$VERSION" \
            --source "$APP" --output dist/selfupdate
          python3 ci/verify_selfupdate_snapshot.py \
            "dist/selfupdate/GenyCaster-selfupdate-v${VERSION}-macos-${{ matrix.arch }}.tar.gz"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows NSIS installer
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # Honor the explicit architecture filter for manual Windows runs.
        # Do not incur both Windows runner charges for an ARM-only test.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && inputs.target_arch == 'x86_64' && '[{"arch":"x86_64","runner":"windows-2022","msvc_arch":"amd64","vcpkg_triplet":"x64-windows"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && inputs.target_arch == 'arm64' && '[{"arch":"arm64","runner":"windows-11-arm","msvc_arch":"arm64","vcpkg_triplet":"arm64-windows"}]' || '[{"arch":"x86_64","runner":"windows-2022","msvc_arch":"amd64","vcpkg_triplet":"x64-windows"},{"arch":"arm64","runner":"windows-11-arm","msvc_arch":"arm64","vcpkg_triplet":"arm64-windows"}]') }}
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install official Qt 6.12 MSVC archives
        shell: pwsh
        run: |
          choco install 7zip nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/install_qt_windows.py --destination Qt --architecture ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'genycaster-vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore built vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/genycaster-vcpkg-binary-cache
          key: genycaster-windows-vcpkg-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            genycaster-windows-vcpkg-
      - name: Install Windows native packages
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            boost-asio:${{ matrix.vcpkg_triplet }} boost-beast:${{ matrix.vcpkg_triplet }} boost-json:${{ matrix.vcpkg_triplet }} `
            boost-multiprecision:${{ matrix.vcpkg_triplet }} boost-property-tree:${{ matrix.vcpkg_triplet }} `
            boost-system:${{ matrix.vcpkg_triplet }} curl:${{ matrix.vcpkg_triplet }} openssl:${{ matrix.vcpkg_triplet }} sqlite3:${{ matrix.vcpkg_triplet }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify required native headers before C++26 scanning
        shell: pwsh
        run: |
          $include = "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg_triplet }}/include"
          $headers = @(
            'boost/json/src.hpp', 'boost/multiprecision/cpp_int.hpp',
            'boost/asio.hpp', 'boost/beast.hpp',
            'boost/property_tree/json_parser.hpp', 'boost/system/error_code.hpp',
            'curl/curl.h', 'sqlite3.h'
          )
          foreach ($header in $headers) {
            $file = Join-Path $include $header
            if (-not (Test-Path $file)) { throw "Windows CI dependency missing: $file" }
          }
      - name: Compile and deploy
        shell: pwsh
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # Qt's MSVC ABI is supported by Clang-CL. MSVC 19.44 cannot
          # satisfy CMake's CXX26 feature requirement; never lower C++26.
          $llvm = "$env:ProgramFiles/LLVM/bin"
          $clang = Join-Path $llvm 'clang-cl.exe'
          $scanner = Join-Path $llvm 'clang-scan-deps.exe'
          if (-not (Test-Path $clang)) { throw 'Clang-CL not available on runner' }
          if (-not (Test-Path $scanner)) { throw 'Clang module scanner not available on runner' }
          & $clang --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Check compiler, SDK and imported Qt architecture before linking.
          if ("${{ matrix.arch }}" -eq "arm64") {
            $machine = & "$env:ProgramFiles/LLVM/bin/clang-cl.exe" --target=arm64-pc-windows-msvc -print-target-triple
            if ($LASTEXITCODE -ne 0 -or $machine -notmatch "arm64") {
              throw "ARM64 Clang-CL toolchain not available"
            }
          }
          # vcpkg z-applocal assumes QtKeychain lives in the official Qt bin,
          # although it is fetched and built separately. Copy all runtime DLLs
          # explicitly below instead of invoking vcpkg's incorrect app-local step.
          cmake -S . -B build/native -G Ninja `
            "-DCMAKE_C_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=$scanner" `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}" `
            "-DVCPKG_APPLOCAL_DEPS=OFF" `
            "-DGENYCASTER_WINDOWS_PACKAGE_ARCH=${{ matrix.arch }}" `
            "-DFARCASTER_BUILD_TESTS=OFF" `
            "-DGENYCASTER_FETCH_QTKEYCHAIN=ON" `
            "-DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build the source-provided QtKeychain first. Some vcpkg toolchains
          # still perform z-applocal dependency scans despite the OFF switch.
          # The scanner expects a Qt-dependent DLL beside the official Qt
          # libraries; stage the real built DLL there before linking the app.
          cmake --build build/native --target qt6keychain --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $keychainBuilt = Get-ChildItem build/native -Recurse -File -Filter 'qt6keychain.dll' |
            Select-Object -First 1
          if (-not $keychainBuilt) { throw 'QtKeychain DLL missing after building its target' }
          $qtBin = Join-Path $env:QT_ROOT_DIR 'bin'
          if (-not (Test-Path $qtBin)) { throw "Missing Qt bin directory: $qtBin" }
          Copy-Item $keychainBuilt.FullName (Join-Path $qtBin 'qt6keychain.dll') -Force
          cmake --build build/native --target genycaster --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/app | Out-Null
          Copy-Item build/native/bin/Genycaster.exe dist/app/
          # Scan only platform-relevant QML: the Linux Quick drawer
          # imports QtWebEngine, which is not a Windows SDK dependency.
          $scan = (Join-Path (Get-Location).Path 'build/windows-qml-scan')
          New-Item -ItemType Directory -Force $scan | Out-Null
          $source = (Resolve-Path 'ui').Path
          Get-ChildItem 'ui' -Recurse -File |
            Where-Object { $_.Extension -in '.qml', '.js' -or $_.Name -eq 'qmldir' } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($source, $_.FullName)
              $normalized = $relative.Replace([char]92, [char]47)
              if ($normalized -in @('app/miniapp/EmbeddedBrowser.qml',
                                    'components/apps/AndroidWebView.qml')) { return }
              $destination = Join-Path $scan $relative
              New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
            }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release `
            --skip-plugin-types sqldrivers,qmltooling `
            --qmldir $scan --dir dist/app dist/app/Genycaster.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # windeployqt bundles Qt but not the non-Qt vcpkg dependency tree.
          # Bundle all DLLs from this build's isolated vcpkg target triplet:
          # libcurl, SQLite and OpenSSL have their own transitive dependencies.
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg_triplet }}/bin"
          $runtimeDlls = @(Get-ChildItem $vcpkgBin -File -Filter '*.dll')
          foreach ($pattern in @('libcrypto*.dll', 'libssl*.dll', '*sqlite*.dll', '*curl*.dll')) {
            if (@($runtimeDlls | Where-Object { $_.Name -like $pattern }).Count -eq 0) {
              throw "Required Windows runtime dependency not found: $pattern"
            }
          }
          foreach ($dll in $runtimeDlls) {
            Copy-Item $dll.FullName dist/app/ -ErrorAction Stop
          }
          $keychain = Get-ChildItem build/native -Recurse -File -Filter '*keychain*.dll' |
            Select-Object -First 1
          if (-not $keychain) { throw 'Missing QtKeychain runtime DLL' }
          Copy-Item $keychain.FullName dist/app/
          # Remove Qt SDK-only directories (headers, import libraries,
          # build tools), preserve QML/plugins, and refuse mixed x64/ARM64 DLLs.
          # Run before CPack and before generating runtime update snapshots.
          python ci/audit_windows_stage.py dist/app ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Load Main.qml from the actual packaged runtime with the runner's
          # Qt/vcpkg SDK paths removed. A successful C++ link is not sufficient.
          & ./ci/smoke_windows_stage.ps1 -Stage dist/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The VC redistributable is executable code installed with elevated
          # rights. Accept only a Microsoft Authenticode-signed bootstrapper.
          $vcArch = if ("${{ matrix.arch }}" -eq "arm64") { "arm64" } else { "x64" }
          $vcRedist = Join-Path (Resolve-Path "dist/app").Path "vc_redist.$vcArch.exe"
          if (-not (Test-Path $vcRedist)) { throw "Missing Microsoft VC runtime $vcArch" }
          $vcSig = Get-AuthenticodeSignature -FilePath $vcRedist
          if ($vcSig.Status -ne "Valid" -or
              -not $vcSig.SignerCertificate -or
              $vcSig.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "Refusing unsigned or untrusted VC runtime redistributable: $vcRedist"
          }
          # NSIS packages the already deployed Qt/QML/keychain/vcpkg DLL
          # tree. Do not substitute a ZIP of uninstalled files for setup.
          cpack --config build/native/CPackConfig.cmake -G NSIS -B dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "dist/GenyCaster-v$env:VERSION-windows-${{ matrix.arch }}.exe"
          if (-not (Test-Path $installer)) { throw "Windows NSIS installer missing" }
          python ci/verify_platform_package.py windows $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" |
            Set-Content -Encoding ascii dist/SHA256SUMS
          # The update transport snapshot excludes the NSIS bootstrap but
          # retains every deployed runtime dependency and per-file SHA-256.
          # Installation still uses the verified installer; no unsafe in-place
          # patching of a running process is attempted.
          python ci/package_selfupdate.py --platform windows `
            --arch "${{ matrix.arch }}" --version "$env:VERSION" `
            --source dist/app --output dist/selfupdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/verify_selfupdate_snapshot.py `
            "dist/selfupdate/GenyCaster-selfupdate-v$env:VERSION-windows-${{ matrix.arch }}.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/selfupdate/*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # A manual Android ARM64 dispatch must build exactly arm64-v8a,
        # not silently spend another runner on armeabi-v7a.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'android' && inputs.target_arch == 'arm64' && '[{"abi":"arm64-v8a","qt_arch":"android_arm64_v8a","openssl_arch":"arm64","machine":"AArch64"}]' || '[{"abi":"arm64-v8a","qt_arch":"android_arm64_v8a","openssl_arch":"arm64","machine":"AArch64"},{"abi":"armeabi-v7a","qt_arch":"android_armv7","openssl_arch":"arm","machine":"ARM"}]') }}
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Verify Android build tools and provision missing SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # Hosted ubuntu-24.04 already contains Perl, Make, Curl, Python,
          # tar and the Ninja installed by lukka/get-cmake. Do not run APT
          # again: transient Ubuntu mirror DNS failures previously killed
          # Android builds before Qt/NDK configuration.
          for tool in perl make curl tar python3 ninja cmake java keytool; do
            command -v "$tool" >/dev/null || {
              echo "::error::Android build tool unavailable: $tool"
              exit 1
            }
          done
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$sdkmanager_bin/sdkmanager" || {
            echo "::error::Android sdkmanager missing: $sdkmanager_bin/sdkmanager"
            exit 1
          }
          export PATH="$sdkmanager_bin:$PATH"
          echo "$sdkmanager_bin" >> "$GITHUB_PATH"
          # An already provisioned runner must not contact Google's SDK
          # index or accept licenses again just to use the same NDK.
          ndk="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [[ -f "$ndk/source.properties" &&
                -d "$ANDROID_HOME/platforms/android-${ANDROID_API}" &&
                -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" &&
                -x "$ANDROID_HOME/build-tools/35.0.0/zipalign" &&
                -x "$ANDROID_HOME/platform-tools/adb" ]]; then
            echo "Android SDK/NDK and build tools already installed"
          else
            echo "Installing only missing Android SDK packages"
            # Running sdkmanager with --install against an unavailable
            # mirror must fail promptly, not consume the full job timeout.
            timeout 360s "$sdkmanager_bin/sdkmanager" --install \
              "ndk;${ANDROID_NDK_VERSION}" \
              "platforms;android-${ANDROID_API}" \
              "build-tools;35.0.0" "platform-tools"
          fi
          test -f "$ndk/source.properties"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        id: qt
        timeout-minutes: 20
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia qtwebview
          cache: true
          # Officially mirrored Qt 6.12 SDK; avoid intermittently stalled
          # direct download.qt.io transfers on hosted Android builders.
          extra: '--base https://qt.mirror.constant.com --timeout 15'
      - name: Reject Android SDKs without Qt Network TLS
        shell: bash
        run: |
          set -euo pipefail
          config="$QT_ROOT_DIR/include/QtNetwork/qtnetwork-config.h"
          test -r "$config" || { echo "::error::Missing Qt Network feature configuration: $config"; exit 1; }
          grep -E '^#define QT_FEATURE_ssl[[:space:]]+' "$config" || true
          if ! grep -Eq '^#define QT_FEATURE_ssl[[:space:]]+1([[:space:]]|$)' "$config"; then
            echo "::error::Qt for Android has SSL disabled; GenyCaster HTTPS transports are fail-closed"
            exit 1
          fi
      # Qt for Android ships the TLS backend, not OpenSSL runtime binaries.
      # Build the pinned Android ABI libraries inside CI, as part of the
      # platform job (no developer-machine bootstrap scripts).
      - name: Prepare Android OpenSSL 3.5.9 libraries
        shell: bash
        run: |
          set -euo pipefail
          version=3.5.9
          url="https://github.com/openssl/openssl/releases/download/openssl-${version}/openssl-${version}.tar.gz"
          work="$RUNNER_TEMP/genycaster-android-openssl"
          mkdir -p "$work" build/android-deps/include build/android-deps/lib
          curl --fail --location --retry 3 --silent --show-error \
            "$url" -o "$work/openssl-${version}.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "${url}.sha256" -o "$work/openssl-${version}.tar.gz.sha256"
          expected="$(awk 'NR==1 {print $1}' "$work/openssl-${version}.tar.gz.sha256")"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid OpenSSL SHA-256"; exit 1; }
          echo "$expected  $work/openssl-${version}.tar.gz" | sha256sum --check --status
          tar -xzf "$work/openssl-${version}.tar.gz" -C "$work"

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          toolchain="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$toolchain:$PATH"
          (
            cd "$work/openssl-${version}"
            # NDK r27 defaults to 4 KiB ELF segments. Android 15+ may use
            # 16 KiB pages; OpenSSL must match the Qt and provider binaries.
            export LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            # OpenSSL's own shlib_variant names both libraries and their ELF
            # SONAME/DT_NEEDED links *during* compilation. Do not post-process
            # native ELF with patchelf: it produced a noncongruent PT_LOAD and
            # crashed QtLoader at application startup ("sign_ctx" in verneed).
            # The Android target's .so extension has no version suffix.
            cat > Configurations/99-genycaster-android.conf <<'OPENSSL_TARGET'
          my %targets = (
              "android-genycaster-arm64" => {
                  inherit_from => [ "android-arm64" ],
                  shared_extension => ".so",
                  shlib_variant => "_3",
              },
              "android-genycaster-arm" => {
                  inherit_from => [ "android-arm" ],
                  shared_extension => ".so",
                  shlib_variant => "_3",
              },
          );
          OPENSSL_TARGET
            ./Configure "android-genycaster-${{ matrix.openssl_arch }}" shared no-tests -D__ANDROID_API__="${ANDROID_API}"
            echo "::group::OpenSSL generated shared-library targets"
            grep -E '^(SHLIBS|SHLIB_VERSION_NUMBER|SHLIB_INFO|build_libs_nodep):' Makefile || true
            echo "::endgroup::"
            make -s -j 4 build_libs
            echo "::group::OpenSSL actual shared-library outputs"
            ls -lh libcrypto* libssl*
            echo "::endgroup::"
            test -s libcrypto_3.so || { echo "::error::libcrypto_3.so not produced by OpenSSL"; exit 1; }
            test -s libssl_3.so || { echo "::error::libssl_3.so not produced by OpenSSL"; exit 1; }
            cp -R include/openssl "$GITHUB_WORKSPACE/build/android-deps/include/"
            cp -L libcrypto_3.so "$GITHUB_WORKSPACE/build/android-deps/lib/libcrypto_3.so"
            cp -L libssl_3.so "$GITHUB_WORKSPACE/build/android-deps/lib/libssl_3.so"
          )
          libdir="$GITHUB_WORKSPACE/build/android-deps/lib"
          # Do not use readelf | grep -q under pipefail: grep can exit
          # before readelf completes, turning a valid ELF into SIGPIPE/141.
          # Save all diagnostics, and fail with the actual headers if needed.
          for lib in libcrypto_3.so libssl_3.so; do
            "$toolchain/llvm-readelf" -h "$libdir/$lib" > "$libdir/$lib.header.txt"
            "$toolchain/llvm-readelf" -d "$libdir/$lib" > "$libdir/$lib.dynamic.txt"
            grep -Eq 'Machine:[[:space:]]+${{ matrix.machine }}' "$libdir/$lib.header.txt" || {
              cat "$libdir/$lib.header.txt"; echo "::error::$lib has an incorrect architecture"; exit 1;
            }
            grep -Fq "Library soname: [$lib]" "$libdir/$lib.dynamic.txt" || {
              cat "$libdir/$lib.dynamic.txt"; echo "::error::$lib has an unexpected SONAME"; exit 1;
            }
          done
          grep -Fq 'Shared library: [libcrypto_3.so]' "$libdir/libssl_3.so.dynamic.txt" || {
            cat "$libdir/libssl_3.so.dynamic.txt"
            echo "::error::libssl_3.so does not depend on libcrypto_3.so"
            exit 1
          }
          test -s build/android-deps/include/openssl/opensslv.h
          echo "Android ${{ matrix.abi }} OpenSSL ${version} verified for APK deployment"
      - name: Prepare signing for release tags only
        if: needs.gate.outputs.release == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo "::error::Android signing secrets are missing"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/genycaster-release.keystore"
          test -s "$RUNNER_TEMP/genycaster-release.keystore"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/genycaster-release.keystore" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Configure and build Android APK
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SIGN_RELEASE: ${{ needs.gate.outputs.release }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          args=(
            -S . -B build/android -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            "-DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            "-DQT_HOST_PATH=$QT_HOST_PATH"
            -DANDROID_ABI=${{ matrix.abi }}
            "-DANDROID_PLATFORM=android-${ANDROID_API}"
            "-DANDROID_SDK_ROOT=$ANDROID_HOME"
            "-DANDROID_NDK=$ANDROID_NDK_ROOT"
            "-DGENYCASTER_ANDROID_OPENSSL_ROOT=$PWD/build/android-deps"
            -DFARCASTER_BUILD_TESTS=OFF
            -DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON
            -DQT_ANDROID_DEPLOY_RELEASE=ON
          )
          if [[ "$SIGN_RELEASE" == true ]]; then
            args+=(
              -DQT_ANDROID_SIGN_APK=ON
              "-DQT_ANDROID_KEYSTORE_PATH=$QT_ANDROID_KEYSTORE_PATH"
              "-DQT_ANDROID_KEYSTORE_ALIAS=$QT_ANDROID_KEYSTORE_ALIAS"
              "-DQT_ANDROID_KEYSTORE_STORE_PASS=$QT_ANDROID_KEYSTORE_STORE_PASS"
              "-DQT_ANDROID_KEYSTORE_KEY_PASS=$QT_ANDROID_KEYSTORE_KEY_PASS"
            )
          fi
          # Qt Network SSL feature was verified before OpenSSL packaging.
          cmake "${args[@]}"
          cmake --build build/android --target genycaster_make_apk --parallel 3
          mkdir -p dist
          # Qt's deploy step may produce a native APK and a Gradle APK.
          # Never select arbitrarily from 'find *.apk' or package Debug.
          output_dir=build/android/ui/android-build/build/outputs/apk/release
          if [[ "$SIGN_RELEASE" == true ]]; then
            mapfile -t apks < <(find "$output_dir" -maxdepth 1 -type f \
              -name '*-signed.apk' ! -name '*unsigned*' | sort)
          else
            apks=("$output_dir/android-build-release-unsigned.apk")
          fi
          if [[ ${#apks[@]} -ne 1 || ! -s "${apks[0]}" ]]; then
            echo "::error::Expected one release APK under $output_dir"
            find build/android/ui -name '*.apk' -print
            exit 1
          fi
          # Every published CI artifact must be installable. A manually
          # dispatched build gets a throwaway test signature, never the
          # protected release key. Only a version tag uses release secrets.
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$signer" || { echo "::error::Missing Android apksigner"; exit 1; }
          selected="${apks[0]}"
          if [[ "$SIGN_RELEASE" != true ]]; then
            test_keystore="$RUNNER_TEMP/genycaster-ci-test.p12"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$test_keystore" -alias genycaster-ci-test \
              -keyalg RSA -keysize 3072 -validity 2 \
              -storepass genycaster-ci-ephemeral -keypass genycaster-ci-ephemeral \
              -dname "CN=GenyCaster CI Test APK, OU=Not For Release"
            selected="$RUNNER_TEMP/genycaster-ci-test-signed.apk"
            "$signer" sign --ks "$test_keystore" \
              --ks-key-alias genycaster-ci-test \
              --ks-pass pass:genycaster-ci-ephemeral \
              --key-pass pass:genycaster-ci-ephemeral \
              --out "$selected" "${apks[0]}"
            echo "WARNING: Android manual artifact uses an ephemeral CI TEST key."
            echo "It is installable for testing, NOT an official release signature."
          fi
          "$signer" verify --verbose --print-certs "$selected"
          # An APK can pass signing and all CMake checks while failing the
          # native loader on devices with 16 KiB pages.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$selected"
          artifact="dist/GenyCaster-v${VERSION}-android-${{ matrix.abi }}.apk"
          if [[ "$SIGN_RELEASE" != true ]]; then
            artifact="dist/GenyCaster-v${VERSION}-android-${{ matrix.abi }}-CI-TEST.apk"
          fi
          cp "$selected" "$artifact"
          python3 ci/verify_platform_package.py android "$artifact"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14


  ios:
    name: iOS arm64 unsigned device app (CI only)
    needs: gate
    # Unsigned .app archives are NOT installable release IPA packages.
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios')
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Install native C++26 build toolchain
        run: brew install ninja llvm boost
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: clang_64
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: ios
          arch: ios
          modules: qtmultimedia
          cache: true
      - name: Build pinned static OpenSSL for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          version=3.5.9
          url="https://github.com/openssl/openssl/releases/download/openssl-${version}/openssl-${version}.tar.gz"
          mkdir -p build/ios-openssl
          curl --fail --location --retry 3 --silent --show-error "${url}" -o build/ios-openssl/openssl.tar.gz
          curl --fail --location --retry 3 --silent --show-error "${url}.sha256" -o build/ios-openssl/openssl.tar.gz.sha256
          expected="$(awk 'NR==1 {print $1}' build/ios-openssl/openssl.tar.gz.sha256)"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
          echo "$expected  build/ios-openssl/openssl.tar.gz" | shasum -a 256 -c
          tar -xzf build/ios-openssl/openssl.tar.gz -C build/ios-openssl
          export CROSS_TOP="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer"
          export CROSS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          export CC="$(xcrun --find clang)"
          export CFLAGS="-arch arm64 -mios-version-min=18.0"
          (
            cd "build/ios-openssl/openssl-${version}"
            ./Configure ios64-cross no-shared no-tests --prefix="$GITHUB_WORKSPACE/build/ios-openssl/install"
            make -j 3
            make install_sw
          )
          test -s build/ios-openssl/install/lib/libcrypto.a
      - name: Compile and inspect unsigned iOS device bundle
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          export CC="$(brew --prefix llvm)/bin/clang"
          export CXX="$(brew --prefix llvm)/bin/clang++"
          cmake -S . -B build/ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DQT_HOST_PATH=$QT_HOST_PATH" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            "-DOPENSSL_ROOT_DIR=$PWD/build/ios-openssl/install" \
            -DFARCASTER_BUILD_TESTS=OFF \
            -DFARCASTER_REQUIRE_SECURE_SIGNER_VAULT=ON
          cmake --build build/ios --target genycaster --parallel 2
          count="$(find build/ios -type d -name 'Genycaster.app' | wc -l | tr -d ' ')"
          test "$count" = 1
          APP="$(find build/ios -type d -name 'Genycaster.app' -print -quit)"
          test -s "$APP/Info.plist"
          test -s "$APP/Genycaster"
          /usr/bin/lipo "$APP/Genycaster" -verify_arch arm64
          mkdir -p dist
          tar -czf "dist/GenyCaster-v${VERSION}-ios-arm64-unsigned-app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
          python3 ci/verify_platform_package.py ios "dist/GenyCaster-v${VERSION}-ios-arm64-unsigned-app.tar.gz"
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-ios-arm64-unsigned-app
          path: dist/*
          if-no-files-found: error
          retention-days: 14


  nixos:
    name: NixOS native package
    needs: gate
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'nixos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Build native NixOS package
        run: |
          set -euo pipefail
          nix build ".#packages.${{ matrix.system }}.default" --print-build-logs --out-link result
          test -x result/bin/Genycaster
          # The Nix wrapper must resolve Qt plugins/QML from its own closure
          # and open the real application's QML root on a headless runner.
          QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software \
            timeout 45s result/bin/Genycaster --smoke-test \
            --settings-path="$RUNNER_TEMP/genycaster-nix-smoke.ini"
      - name: Record Nix store closure for reproducibility
        run: |
          set -euo pipefail
          mkdir -p dist
          nix-store -qR result | sort > "dist/GenyCaster-nixos-${{ matrix.system }}-closure.txt"
          nix path-info -S result > "dist/GenyCaster-nixos-${{ matrix.system }}-size.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-nixos-${{ matrix.system }}-manifest
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  web:
    name: WebAssembly (single-threaded)
    needs: gate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'web'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '5.0.5'
          actions-cache-folder: emsdk-cache
      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
      - name: Install host Qt ShaderTools (qsb for cross-build)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: wasm
          arch: wasm_singlethread
          cache: true
      - name: Build Qt Multimedia WebAssembly tech-preview from verified source
        shell: bash
        run: bash ci/build_qt_wasm_multimedia.sh
      - name: Build and package browser application
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          cmake -S . -B build/web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            "-DQT_HOST_PATH=$QT_HOST_PATH" \
            -DFARCASTER_BUILD_TESTS=OFF
          cmake --build build/web --target genycaster_wasm_asset_refresh --parallel 3
          mkdir -p dist
          python3 ci/package_web.py \
            --source build/web/bin \
            --output "dist/GenyCaster-v${VERSION}-web-wasm.tar.gz"
          python3 ci/verify_platform_package.py web "dist/GenyCaster-v${VERSION}-web-wasm.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: GenyCaster-web-wasm
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish version-tag release
    needs: [gate, linux, macos, windows, android, web]
    if: github.event_name == 'push' && needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse overwriting an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify mandatory packages and aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          for name in GenyCaster-linux-x86_64 GenyCaster-linux-arm64 \
                      GenyCaster-macos-arm64 GenyCaster-macos-x86_64 \
                      GenyCaster-windows-x86_64 GenyCaster-windows-arm64 \
                      GenyCaster-android-arm64-v8a GenyCaster-android-armeabi-v7a \
                      GenyCaster-web-wasm; do
            test -d "artifacts/$name"
            test -n "$(find "artifacts/$name" -type f -print -quit)"
          done
          python3 ci/release_artifacts.py artifacts release
      - name: Publish versioned Release as GitHub Actions bot
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: GenyCaster ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          # RC/beta/alpha tags remain prereleases. A stable tag is a normal
          # Release only after every mandatory platform job passes.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          fail_on_unmatched_files: true
