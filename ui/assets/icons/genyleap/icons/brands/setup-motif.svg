<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560">
  <title>GenyCaster onboarding decorative G mark</title>
  <desc>Soft white circular frame with the GenyCaster G and forward-arrow silhouette in lavender, built from the first-party G mark.</desc>
  <defs>
    <linearGradient id="mark" x1="0.05" y1="0.18" x2="0.88" y2="0.92">
      <stop offset="0" stop-color="#B7B8E4"/>
      <stop offset="1" stop-color="#D1D1F0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#FAFAFF" stop-opacity="0.86"/>
    </linearGradient>
  </defs>
  <circle cx="280" cy="280" r="272" fill="url(#ring)"/>
  <circle cx="280" cy="280" r="181" fill="url(#mark)"/>
  <path d="M 251 261 H 460 L 364 377 Z" fill="#FAFAFF"/>
</svg>