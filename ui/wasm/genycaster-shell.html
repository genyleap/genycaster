<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11192e">
<link rel="manifest" href="genycaster.webmanifest">
<title>Genycaster — Secure social client</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f3f7}
#qt-screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
#genycaster-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 4%,#dce6ff,transparent 65%),#f3f5fa;color:#111b32;transition:opacity .35s ease}
#genycaster-boot.finished{opacity:0;pointer-events:none}
.boot-content{width:min(470px,100%);padding:36px 26px;text-align:center;background:transparent;border:0;box-shadow:none}
.boot-mark{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
.boot-glyph{display:block;width:64px;height:64px;background:#315fff;-webkit-mask:url("./genycaster-brand.svg") center/contain no-repeat;mask:url("./genycaster-brand.svg") center/contain no-repeat}
.boot-brand{font-size:25px;font-weight:750;letter-spacing:-.045em}.boot-note{font-size:13px;color:#647087;margin-top:4px}
h1{font-size:22px;line-height:1.14;letter-spacing:-.035em;margin:0 0 12px}
.boot-status{font-size:14px;line-height:1.5;color:#677186;min-height:48px;margin:0 0 24px}
.boot-track{height:7px;background:#e4e8f2;border-radius:99px;overflow:hidden}
.boot-fill{height:100%;width:24%;border-radius:99px;background:linear-gradient(90deg,#2f5bfa,#76a1ff);animation:indeterminate 1.65s ease-in-out infinite}
.boot-fill.measured{animation:none;transition:width .16s linear}
.boot-foot{display:flex;justify-content:space-between;gap:10px;margin-top:13px;font-size:12px;color:#728098}
#boot-percent{font-variant-numeric:tabular-nums;color:#365ce8;font-weight:700}
#boot-retry{display:none;margin:22px auto 0;padding:11px 17px;border:0;border-radius:10px;color:white;background:#305cf4;font-weight:650;cursor:pointer}
#boot-retry.visible{display:block}
@keyframes indeterminate{0%{transform:translateX(-100%)}50%{transform:translateX(190%)}100%{transform:translateX(430%)}}
.boot-credit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:0;right:0;text-align:center;color:#65728c;font-size:12px;letter-spacing:.015em}
@media(max-width:540px){#genycaster-boot{padding:15px}.boot-content{padding:30px 22px}h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){.boot-fill,.boot-glyph{animation:none}.boot-fill{width:45%}*{transition:none!important}}
</style>
</head>
<body>
<div id="qt-screen" aria-label="Genycaster application"></div>
<div id="genycaster-boot" role="status" aria-live="polite">
  <div class="boot-content">
    <div class="boot-mark"><span class="boot-glyph" aria-hidden="true"></span><div><div class="boot-brand">Genycaster</div><div class="boot-note">Secure social client</div></div></div>
    <h1 id="boot-heading">Preparing Genycaster</h1>
    <p class="boot-status" id="boot-status">Checking local application resources…</p>
    <div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-foot"><span id="boot-stage">Starting</span><span id="boot-percent" aria-label="Measured download progress"></span></div>
    <button id="boot-retry" type="button">Try again</button>
  </div>
  <div class="boot-credit">Powered by <strong>Genyleap</strong> · Qt &amp; WebAssembly</div>
</div>
<script src="qtloader.js"></script>
<script src="farcaster_client.js"></script>
<script src="genycaster-assets.js"></script>
<script src="genycaster-loader.js"></script>
</body>
</html>
