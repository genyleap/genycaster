<!doctype html>
<html lang="en" data-chrome-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Paint the initial status-bar sampling surface in the last Qt appearance,
     not unconditionally dark before WASM/QML has had a chance to initialize. -->
<script>
(function () {
    let dark = window.matchMedia
        ? window.matchMedia("(prefers-color-scheme: dark)").matches : true;
    try {
        const saved = localStorage.getItem("genycaster.browser.chrome.v1");
        if (saved === "light") dark = false;
        else if (saved === "dark") dark = true;
    } catch (_) { /* private-mode storage may be unavailable */ }
    document.documentElement.setAttribute("data-chrome-theme", dark ? "dark" : "light");
    document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b0c0f" : "#f1f1f3");
})();
</script>
<!-- Do not force black-translucent: WebKit deprecates it for mixed light/dark
     appearances. Let iOS choose status icons/chrome from the page colors. -->
<link rel="icon" href="./genycaster-icon.svg?v=brand-2" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="genycaster.webmanifest?v=chrome-3">
<title>Genycaster Beta 1.0</title>
<style>
:root{color-scheme:dark light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--app-chrome:#0b0c0f}
:root[data-chrome-theme="light"]{color-scheme:light;--app-chrome:#f1f1f3;--boot-ink:#142039}
:root[data-chrome-theme="dark"]{color-scheme:dark;--app-chrome:#0b0c0f;--boot-ink:#f1f1f3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--app-chrome)}
/* WebKit samples real fixed DOM elements when painting the installed PWA
   status bar. Pseudo-elements and a body gradient are not reliable samplers. */
#ios-status-chrome{position:fixed;top:0;left:0;right:0;height:max(env(safe-area-inset-top,0px),1px);background-color:var(--app-chrome);pointer-events:none;z-index:6}
#qt-screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;z-index:1}
#qt-screen canvas{touch-action:none;-webkit-touch-callout:none}
#genycaster-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--app-chrome);color:var(--boot-ink);transition:opacity .26s ease}
#genycaster-boot.finished{opacity:0;pointer-events:none}
/* A running WASM tab does not update when its deployment changes. Present an
   explicit, non-destructive refresh affordance above Qt, never auto-reload an
   editor or discard a locally stored identity. */
/* A real, top-edge release drawer above the live Qt canvas. It slides down,
   stays inside iOS safe areas and never reloads a draft without a click. */
#genycaster-update-backdrop{position:fixed;inset:0;z-index:129;background:#0008;backdrop-filter:blur(3px)}
#genycaster-update-backdrop[hidden],#genycaster-update-banner[hidden]{display:none}
#genycaster-update-banner{position:fixed;z-index:130;top:0;left:50%;width:min(600px,100%);max-height:min(78dvh,600px);overflow:auto;transform:translateX(-50%);padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 22px;border:1px solid #8292b54a;border-top:0;border-radius:0 0 24px 24px;background:var(--app-chrome);color:var(--boot-ink);box-shadow:0 22px 70px #0008;font:500 14px/1.45 system-ui,-apple-system,sans-serif;animation:genycasterDrawerIn .32s cubic-bezier(.18,.8,.23,1) both}
@keyframes genycasterDrawerIn{from{opacity:.65;transform:translate(-50%,-110%)}to{opacity:1;transform:translate(-50%,0)}}
.update-grabber{width:40px;height:4px;margin:0 auto 18px;border-radius:5px;background:#8491a36e}
.update-head{display:flex;gap:14px;align-items:center}
.update-glyph{display:grid;place-items:center;flex:0 0 48px;height:48px;border-radius:15px;background:#667df226;color:white}
.update-glyph svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.update-copy{flex:1;min-width:0}
#genycaster-update-title{font-size:18px;font-weight:750;display:block;line-height:1.35}
#genycaster-update-hint{display:block;opacity:.68;margin-top:4px;font-size:13px}
.update-version-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin:22px 0 16px}
.update-version{border:1px solid #8292b540;border-radius:14px;padding:12px;min-width:0}
.update-version span{display:block;font-size:12px;opacity:.65}
.update-version strong{display:block;margin-top:7px;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.update-version small{display:block;margin-top:4px;opacity:.66;font-size:11px}
.update-version-arrow{font-size:20px;opacity:.65}
.update-details{padding:14px 16px;background:#8396c110;border:1px solid #8292b52a;border-radius:14px}
.update-details strong{display:block;font-size:13px}
.update-details p{margin:6px 0 0;font-size:13px;opacity:.78;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.update-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
#genycaster-update-banner button{font:600 14px system-ui,-apple-system,sans-serif;min-height:44px;padding:9px 18px;border-radius:12px;border:1px solid #8796b966;background:transparent;color:inherit;cursor:pointer}
#genycaster-update-now{background:#536ff0!important;border-color:#536ff0!important;color:#fff!important}
#genycaster-update-banner button:focus-visible{outline:2px solid #536ff0;outline-offset:3px}
@media(max-width:560px){#genycaster-update-banner{padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 20px;border-radius:0 0 22px 22px;max-height:82dvh}.update-version-grid{gap:7px}.update-version{padding:10px}.update-version strong{font-size:15px}}
@media(prefers-reduced-motion:reduce){#genycaster-update-banner{animation:none}}
.boot-content{width:min(380px,100%);padding:24px 8px;text-align:center}
.boot-mark{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:52px}
.boot-glyph{display:block;width:64px;height:64px;background:#315fff;-webkit-mask:url("./genycaster-brand.svg") center/contain no-repeat;mask:url("./genycaster-brand.svg") center/contain no-repeat}
.boot-brand{display:inline-flex;align-items:flex-start;justify-content:center;gap:5px;font-size:26px;line-height:1.3;font-weight:750;letter-spacing:-.045em;white-space:nowrap}
.boot-beta{font-size:10px;font-weight:700;letter-spacing:0;color:#315fff;line-height:1;white-space:nowrap;transform:translateY(3px)}
h1{font-size:17px;line-height:1.45;font-weight:600;letter-spacing:-.01em;margin:0 0 20px}
.boot-track{height:5px;background:#dfe5f1;border-radius:99px;overflow:hidden}
.boot-fill{height:100%;width:28%;border-radius:99px;background:#315fff;animation:indeterminate 1.8s ease-in-out infinite}
.boot-fill.measured{animation:none;transition:width .16s linear}
.boot-foot{display:flex;justify-content:space-between;gap:12px;margin-top:13px;font-size:12px;line-height:1.4;color:#738099}
#boot-percent{font-variant-numeric:tabular-nums;color:#315fff;font-weight:650}
.boot-status{display:none;font-size:13px;line-height:1.55;color:#69758b;margin:16px 0 0;overflow-wrap:anywhere}
#genycaster-boot[data-phase="failed"] .boot-status{display:block}
#genycaster-boot[data-phase="failed"] .boot-fill{animation:none;width:100%;background:#c45b70;opacity:.65}
#boot-retry{display:none;margin:18px auto 0;padding:11px 17px;border:0;border-radius:10px;color:#fff;background:#315fff;font-weight:650;cursor:pointer}
#boot-retry.visible{display:block}
#boot-retry:focus-visible{outline:2px solid #315fff;outline-offset:3px}
@keyframes indeterminate{0%{transform:translateX(-110%)}50%{transform:translateX(135%)}100%{transform:translateX(360%)}}
.boot-build{font-size:11px;font-variant-numeric:tabular-nums;color:#7a859a;letter-spacing:.01em;min-height:16px}
.boot-build:empty{display:none}
.boot-credit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 18px;text-align:center;color:#65728c;font-size:12px;letter-spacing:.015em}
/* When the iPhone safe area extends beyond the Qt canvas, the exposed bottom
   corners should match the full-bleed dark navigation footer, never turn light. */
@media(max-width:700px){body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:25%;background-color:#202128;pointer-events:none;z-index:0}}
@media(max-width:540px){#genycaster-boot{padding:18px}.boot-content{padding:20px 8px}.boot-mark{margin-bottom:44px}.boot-credit{font-size:11px}}
@media(prefers-reduced-motion:reduce){.boot-fill{animation:none;transform:none;width:40%}*{transition:none!important}}
</style>
</head>
<body>
<div id="ios-status-chrome" aria-hidden="true"></div>
<div id="qt-screen" aria-label="Genycaster application"></div>
<div id="genycaster-update-backdrop" hidden></div>
<section id="genycaster-update-banner" role="dialog" aria-modal="true" aria-labelledby="genycaster-update-title" hidden>
  <div class="update-grabber" aria-hidden="true"></div>
  <div class="update-head">
    <div class="update-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.5-2"/></svg></div>
    <div class="update-copy"><strong id="genycaster-update-title">Genycaster update</strong><span id="genycaster-update-hint">A newer release is available.</span></div>
  </div>
  <div class="update-version-grid">
    <div class="update-version"><span id="genycaster-update-current-label">Current build</span><strong id="genycaster-update-current">—</strong><small id="genycaster-update-current-channel"></small></div>
    <span class="update-version-arrow" aria-hidden="true">→</span>
    <div class="update-version"><span id="genycaster-update-next-label">New build</span><strong id="genycaster-update-next">—</strong><small id="genycaster-update-next-channel"></small></div>
  </div>
  <div class="update-details"><strong id="genycaster-update-details-title">Release details</strong><p id="genycaster-update-details">Review the new version before updating.</p></div>
  <div class="update-actions"><button id="genycaster-update-later" type="button">Later</button><button id="genycaster-update-now" type="button">Update now</button></div>
</section>
<div id="genycaster-boot" role="status" aria-live="polite">
  <div class="boot-content">
    <div class="boot-mark">
      <span class="boot-glyph" aria-hidden="true"></span>
      <div class="boot-brand">Genycaster<sup class="boot-beta">Beta 1.0</sup></div>
    </div>
    <h1 id="boot-heading">Preparing Genycaster…</h1>
    <p class="boot-status" id="boot-status"></p>
    <div class="boot-track" role="progressbar" aria-label="Application loading" aria-valuetext="Preparing application" id="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-foot"><span id="boot-stage">Checking application files</span><span id="boot-percent" aria-label="Measured download progress"></span></div>
    <button id="boot-retry" type="button">Try again</button>
  </div>
  <div class="boot-credit"><div>Powered by <strong>Genyleap</strong> · WASM Engine</div><div class="boot-build" id="boot-build-credit"></div></div>
</div>
<script src="qtloader.js"></script>
<script src="farcaster_client.js"></script>
<script src="genycaster-assets.js"></script>
<script src="genycaster-loader.js"></script>
</body>
</html>
