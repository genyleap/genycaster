<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./genycaster-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="genycaster.webmanifest">
<title>Genycaster Beta 1.0 — Secure social client</title>
<style>
:root{color-scheme:dark light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--app-chrome:#0b0c0f}
:root[data-chrome-theme="light"]{color-scheme:light;--app-chrome:#f1f1f3}
:root[data-chrome-theme="dark"]{color-scheme:dark;--app-chrome:#0b0c0f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--app-chrome)}
#qt-screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
#qt-screen canvas{touch-action:none;-webkit-touch-callout:none}
#genycaster-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 4%,#dce6ff,transparent 65%),#f3f5fa;color:#111b32;transition:opacity .35s ease}
#genycaster-boot.finished{opacity:0;pointer-events:none}
#genycaster-boot[data-phase="failed"] .boot-fill{animation:none;width:100%;background:#cc6075;opacity:.6}
.boot-content{width:min(520px,100%);padding:clamp(18px,4vw,36px);text-align:center;background:transparent;border:0;box-shadow:none}
.boot-mark{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px}
.boot-glyph{display:block;width:64px;height:64px;background:#315fff;-webkit-mask:url("./genycaster-brand.svg") center/contain no-repeat;mask:url("./genycaster-brand.svg") center/contain no-repeat}
.boot-brand{display:inline-flex;align-items:flex-start;justify-content:center;gap:5px;font-size:25px;line-height:1.3;font-weight:750;letter-spacing:-.045em;white-space:nowrap}.boot-note{font-size:13px;line-height:1.5;color:#647087;margin-top:7px;min-height:20px}
.boot-beta{font-size:10px;font-weight:700;letter-spacing:0;color:#315fff;line-height:1;white-space:nowrap;transform:translateY(3px)}
.boot-build{font-size:11px;font-variant-numeric:tabular-nums;color:#7a859a;letter-spacing:.01em;min-height:16px}
.boot-build:empty{display:none}
h1{font-size:22px;line-height:1.14;letter-spacing:-.035em;margin:0 0 12px}
.boot-status{font-size:clamp(13px,2vw,15px);line-height:1.55;color:#677186;min-height:48px;margin:0 0 24px;text-wrap:balance}
.boot-track{height:7px;background:#e4e8f2;border-radius:99px;overflow:hidden}
.boot-fill{height:100%;width:24%;border-radius:99px;background:linear-gradient(90deg,#2f5bfa,#76a1ff);animation:indeterminate 1.65s ease-in-out infinite}
.boot-fill.measured{animation:none;transition:width .16s linear}
.boot-foot{display:flex;justify-content:space-between;gap:10px;margin-top:13px;font-size:12px;color:#728098}
.boot-journey{display:flex;align-items:center;justify-content:center;gap:14px;min-height:36px;margin:0 0 22px;padding:0;list-style:none}
.boot-journey li{box-sizing:border-box;display:flex;align-items:center;gap:8px;flex:0 0 auto;min-height:30px;padding:4px 6px;border-radius:999px;color:#71809a;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.boot-journey li+li:before{content:"";display:block;width:15px;min-width:15px;height:1px;background:#cbd3e3;margin-right:3px;flex:0 0 15px}
.boot-dot{box-sizing:border-box;display:inline-grid;place-items:center;width:18px;min-width:18px;max-width:18px;height:18px;min-height:18px;max-height:18px;flex:0 0 18px;border:2px solid #abb7cf;border-radius:50%;color:transparent;background:transparent;box-shadow:none;line-height:1;transition:background-color .15s,border-color .15s}
.boot-dot:after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:transparent;flex-shrink:0}
#genycaster-boot[data-mode="warm"] .install-journey{display:none}
#genycaster-boot[data-mode="install"] .warm-journey{display:none}
#genycaster-boot .warm-journey{display:none}
#genycaster-boot[data-mode="warm"] .warm-journey{display:flex}
#genycaster-boot[data-mode="install"][data-phase="download"] .install-journey [data-step="download"],
#genycaster-boot[data-mode="install"][data-phase="install"] .install-journey [data-step="install"],
#genycaster-boot[data-mode="install"][data-phase="initialize"] .install-journey [data-step="initialize"],
#genycaster-boot[data-mode="warm"][data-phase="initialize"] .warm-journey [data-step="runtime"],
#genycaster-boot[data-mode="warm"][data-phase="interface"] .warm-journey [data-step="interface"]{color:#315fff}
#genycaster-boot[data-mode="install"][data-phase="download"] [data-step="download"] .boot-dot,
#genycaster-boot[data-mode="install"][data-phase="install"] [data-step="install"] .boot-dot,
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="initialize"] .boot-dot,
#genycaster-boot[data-mode="warm"][data-phase="initialize"] [data-step="runtime"] .boot-dot,
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="interface"] .boot-dot{border-color:#315fff;background:#315fff;box-shadow:none}
#genycaster-boot[data-mode="install"][data-phase="download"] [data-step="download"] .boot-dot:after,
#genycaster-boot[data-mode="install"][data-phase="install"] [data-step="install"] .boot-dot:after,
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="initialize"] .boot-dot:after,
#genycaster-boot[data-mode="warm"][data-phase="initialize"] [data-step="runtime"] .boot-dot:after,
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="interface"] .boot-dot:after{background:white}
#genycaster-boot[data-mode="install"][data-phase="install"] [data-step="download"],
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="download"],
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="install"],
#genycaster-boot[data-mode="install"][data-phase="interface"] .install-journey li,
#genycaster-boot[data-mode="install"][data-phase="ready"] .install-journey li,
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="runtime"],
#genycaster-boot[data-mode="warm"][data-phase="ready"] .warm-journey li{color:#168a60}
#genycaster-boot[data-mode="install"][data-phase="install"] [data-step="download"] .boot-dot,
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="download"] .boot-dot,
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="install"] .boot-dot,
#genycaster-boot[data-mode="install"][data-phase="interface"] .install-journey .boot-dot,
#genycaster-boot[data-mode="install"][data-phase="ready"] .install-journey .boot-dot,
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="runtime"] .boot-dot,
#genycaster-boot[data-mode="warm"][data-phase="ready"] .warm-journey .boot-dot{background:#19976d;border-color:#19976d;color:#fff}
#genycaster-boot[data-mode="install"][data-phase="install"] [data-step="download"] .boot-dot:after,
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="download"] .boot-dot:after,
#genycaster-boot[data-mode="install"][data-phase="initialize"] [data-step="install"] .boot-dot:after,
#genycaster-boot[data-mode="install"][data-phase="interface"] .install-journey .boot-dot:after,
#genycaster-boot[data-mode="install"][data-phase="ready"] .install-journey .boot-dot:after,
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="runtime"] .boot-dot:after,
#genycaster-boot[data-mode="warm"][data-phase="ready"] .warm-journey .boot-dot:after{content:"✓";width:auto;height:auto;background:transparent;border-radius:0;font-size:11px;font-weight:800;color:#fff}
#boot-percent{font-variant-numeric:tabular-nums;color:#365ce8;font-weight:700}
#boot-retry{display:none;margin:22px auto 0;padding:11px 17px;border:0;border-radius:10px;color:white;background:#305cf4;font-weight:650;cursor:pointer}
#boot-retry.visible{display:block}
#boot-retry:focus{outline:none}
#boot-retry:focus-visible{outline:2px solid #315fff;outline-offset:3px}
@keyframes indeterminate{0%{transform:translateX(-100%)}50%{transform:translateX(190%)}100%{transform:translateX(430%)}}
.boot-credit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 18px;text-align:center;color:#65728c;font-size:12px;letter-spacing:.015em}
@media(max-width:540px){#genycaster-boot{padding:15px}.boot-content{padding:24px 10px}h1{font-size:clamp(19px,5vw,24px)}.boot-journey{gap:4px;flex-wrap:wrap}.boot-journey li{font-size:11px;gap:5px}.boot-journey li+li:before{width:7px;min-width:7px;flex-basis:7px;margin-right:0}.boot-credit{font-size:11px}}
@media(prefers-reduced-motion:reduce){.boot-fill,.boot-glyph{animation:none}.boot-fill{width:45%}*{transition:none!important}}
</style>
</head>
<body>
<div id="qt-screen" aria-label="Genycaster application"></div>
<div id="genycaster-boot" role="status" aria-live="polite">
  <div class="boot-content">
    <div class="boot-mark"><span class="boot-glyph" aria-hidden="true"></span><div><div class="boot-brand">Genycaster<sup class="boot-beta">Beta 1.0</sup></div><div class="boot-note" id="boot-note">Explore conversations</div></div></div>
    <ol class="boot-journey install-journey" id="boot-journey" aria-label="First launch progress">
      <li data-step="download"><span class="boot-dot" aria-hidden="true"></span>Download</li>
      <li data-step="install"><span class="boot-dot" aria-hidden="true"></span>Install</li>
      <li data-step="initialize"><span class="boot-dot" aria-hidden="true"></span>Initialize</li>
    </ol>
    <ol class="boot-journey warm-journey" aria-label="Startup progress">
      <li data-step="runtime"><span class="boot-dot" aria-hidden="true"></span>Runtime</li>
      <li data-step="interface"><span class="boot-dot" aria-hidden="true"></span>Social interface</li>
    </ol>
    <h1 id="boot-heading">Preparing Social Workspace</h1>
    <p class="boot-status" id="boot-status">Checking local application resources…</p>
    <div class="boot-track" role="progressbar" aria-label="Application initialization" aria-valuetext="Preparing application" id="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-foot"><span id="boot-stage">Starting</span><span id="boot-percent" aria-label="Measured progress if available"></span></div>
    <button id="boot-retry" type="button">Try again</button>
  </div>
  <div class="boot-credit"><div>Powered by <strong>Genyleap</strong> · WASM Engine</div><div class="boot-build" id="boot-build-credit"></div></div>
</div>
<script src="qtloader.js"></script>
<script src="farcaster_client.js"></script>
<script src="genycaster-assets.js"></script>
<script src="genycaster-loader.js"></script>
</body>
</html>
