<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11192e">
<link rel="icon" href="./genycaster-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="genycaster.webmanifest">
<title>Genycaster — Secure social client</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f3f7}
#qt-screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
#genycaster-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 4%,#dce6ff,transparent 65%),#f3f5fa;color:#111b32;transition:opacity .35s ease}
#genycaster-boot.finished{opacity:0;pointer-events:none}
#genycaster-boot[data-phase="failed"] .boot-fill{animation:none;width:100%;background:#cc6075;opacity:.6}
.boot-content{width:min(520px,100%);padding:clamp(18px,4vw,36px);text-align:center;background:transparent;border:0;box-shadow:none}
.boot-mark{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
.boot-glyph{display:block;width:64px;height:64px;background:#315fff;-webkit-mask:url("./genycaster-brand.svg") center/contain no-repeat;mask:url("./genycaster-brand.svg") center/contain no-repeat}
.boot-brand{font-size:25px;font-weight:750;letter-spacing:-.045em}.boot-note{font-size:13px;color:#647087;margin-top:4px}
h1{font-size:22px;line-height:1.14;letter-spacing:-.035em;margin:0 0 12px}
.boot-status{font-size:clamp(13px,2vw,15px);line-height:1.55;color:#677186;min-height:48px;margin:0 0 24px;text-wrap:balance}
.boot-track{height:7px;background:#e4e8f2;border-radius:99px;overflow:hidden}
.boot-fill{height:100%;width:24%;border-radius:99px;background:linear-gradient(90deg,#2f5bfa,#76a1ff);animation:indeterminate 1.65s ease-in-out infinite}
.boot-fill.measured{animation:none;transition:width .16s linear}
.boot-foot{display:flex;justify-content:space-between;gap:10px;margin-top:13px;font-size:12px;color:#728098}
.boot-journey{display:flex;align-items:center;justify-content:center;gap:11px;margin:0 0 22px;padding:0;list-style:none;color:#71809a}
.boot-journey li{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:550;transition:color .15s ease}
.boot-journey li+li:before{content:"";display:block;width:16px;height:1px;background:#cbd3e3;margin-right:5px}
.boot-dot{width:17px;height:17px;border:1.5px solid #b5bed1;border-radius:50%;display:grid;place-items:center;font-size:11px;color:transparent;flex-shrink:0}
#genycaster-boot[data-phase="download"] [data-step="download"],#genycaster-boot[data-phase="install"] [data-step="install"],#genycaster-boot[data-phase="initialize"] [data-step="initialize"]{color:#315fff;font-weight:700}
#genycaster-boot[data-phase="download"] [data-step="download"] .boot-dot,#genycaster-boot[data-phase="install"] [data-step="install"] .boot-dot,#genycaster-boot[data-phase="initialize"] [data-step="initialize"] .boot-dot{border-color:#315fff;background:#e5ecff;box-shadow:0 0 0 4px rgba(49,95,255,.08)}
#genycaster-boot[data-phase="install"] [data-step="download"] .boot-dot,#genycaster-boot[data-phase="initialize"] [data-step="download"] .boot-dot,#genycaster-boot[data-phase="initialize"] [data-step="install"] .boot-dot,#genycaster-boot[data-phase="ready"] .boot-dot{border-color:#1a9a68;background:#1a9a68;color:white}
#genycaster-boot[data-phase="install"] [data-step="download"] .boot-dot:after,#genycaster-boot[data-phase="initialize"] [data-step="download"] .boot-dot:after,#genycaster-boot[data-phase="initialize"] [data-step="install"] .boot-dot:after,#genycaster-boot[data-phase="ready"] .boot-dot:after{content:"✓"}
#genycaster-boot[data-mode="warm"] .install-journey{display:none}
#genycaster-boot[data-mode="install"] .warm-journey{display:none}
#genycaster-boot .warm-journey{display:none}
#genycaster-boot[data-mode="warm"] .warm-journey{display:flex}
#genycaster-boot [data-step]{white-space:nowrap}
#genycaster-boot[data-phase="ready"] [data-step]{color:#168a60}
#genycaster-boot[data-mode="warm"][data-phase="initialize"] [data-step="runtime"],
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="interface"]{color:#315fff;font-weight:700}
#genycaster-boot[data-mode="warm"][data-phase="initialize"] [data-step="runtime"] .boot-dot,
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="interface"] .boot-dot{border-color:#315fff;background:#e5ecff;box-shadow:0 0 0 4px rgba(49,95,255,.08)}
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="runtime"] .boot-dot,
#genycaster-boot[data-mode="warm"][data-phase="ready"] .boot-dot{border-color:#1a9a68;background:#1a9a68;color:white}
#genycaster-boot[data-mode="warm"][data-phase="interface"] [data-step="runtime"] .boot-dot:after,
#genycaster-boot[data-mode="warm"][data-phase="ready"] .boot-dot:after{content:"✓"}
#genycaster-boot[data-phase="interface"] .install-journey [data-step="initialize"]{color:#315fff;font-weight:700}
#genycaster-boot[data-phase="interface"] .install-journey .boot-dot{border-color:#1a9a68;background:#1a9a68;color:white}
#genycaster-boot[data-phase="interface"] .install-journey .boot-dot:after{content:"✓"}
#boot-percent{font-variant-numeric:tabular-nums;color:#365ce8;font-weight:700}
#boot-retry{display:none;margin:22px auto 0;padding:11px 17px;border:0;border-radius:10px;color:white;background:#305cf4;font-weight:650;cursor:pointer}
#boot-retry.visible{display:block}
@keyframes indeterminate{0%{transform:translateX(-100%)}50%{transform:translateX(190%)}100%{transform:translateX(430%)}}
.boot-credit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:0;right:0;text-align:center;color:#65728c;font-size:12px;letter-spacing:.015em}
@media(max-width:540px){#genycaster-boot{padding:15px}.boot-content{padding:24px 10px}h1{font-size:clamp(19px,5vw,24px)}.boot-journey{gap:5px;flex-wrap:wrap}.boot-journey li{font-size:11px}.boot-journey li+li:before{width:8px;margin-right:2px}.boot-credit{font-size:11px}}
@media(prefers-reduced-motion:reduce){.boot-fill,.boot-glyph{animation:none}.boot-fill{width:45%}*{transition:none!important}}
</style>
</head>
<body>
<div id="qt-screen" aria-label="Genycaster application"></div>
<div id="genycaster-boot" role="status" aria-live="polite">
  <div class="boot-content">
    <div class="boot-mark"><span class="boot-glyph" aria-hidden="true"></span><div><div class="boot-brand">Genycaster</div><div class="boot-note">Secure social client</div></div></div>
    <ol class="boot-journey install-journey" id="boot-journey" aria-label="First launch progress">
      <li data-step="download"><span class="boot-dot" aria-hidden="true"></span>Download</li>
      <li data-step="install"><span class="boot-dot" aria-hidden="true"></span>Install</li>
      <li data-step="initialize"><span class="boot-dot" aria-hidden="true"></span>Initialize</li>
    </ol>
    <ol class="boot-journey warm-journey" aria-label="Startup progress">
      <li data-step="runtime"><span class="boot-dot" aria-hidden="true"></span>Runtime</li>
      <li data-step="interface"><span class="boot-dot" aria-hidden="true"></span>Social interface</li>
    </ol>
    <h1 id="boot-heading">Preparing Social Workspace</h1>
    <p class="boot-status" id="boot-status">Checking local application resources…</p>
    <div class="boot-track" role="progressbar" aria-label="Application initialization" aria-valuetext="Preparing application" id="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-foot"><span id="boot-stage">Starting</span><span id="boot-percent" aria-label="Measured progress if available"></span></div>
    <button id="boot-retry" type="button">Try again</button>
  </div>
  <div class="boot-credit">Powered by <strong>Genyleap</strong> · WASM Engine</div>
</div>
<script src="qtloader.js"></script>
<script src="farcaster_client.js"></script>
<script src="genycaster-assets.js"></script>
<script src="genycaster-loader.js"></script>
</body>
</html>
