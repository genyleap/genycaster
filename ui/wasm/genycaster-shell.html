<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./genycaster-icon.svg?v=brand-2" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="genycaster.webmanifest?v=brand-2">
<title>Genycaster Beta 1.0</title>
<style>
:root{color-scheme:dark light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--app-chrome:#0b0c0f}
:root[data-chrome-theme="light"]{color-scheme:light;--app-chrome:#f1f1f3}
:root[data-chrome-theme="dark"]{color-scheme:dark;--app-chrome:#0b0c0f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--app-chrome)}
#qt-screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
#qt-screen canvas{touch-action:none;-webkit-touch-callout:none}
#genycaster-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:#f3f5fa;color:#142039;transition:opacity .26s ease}
#genycaster-boot.finished{opacity:0;pointer-events:none}
.boot-content{width:min(380px,100%);padding:24px 8px;text-align:center}
.boot-mark{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:52px}
.boot-glyph{display:block;width:64px;height:64px;background:#315fff;-webkit-mask:url("./genycaster-brand.svg") center/contain no-repeat;mask:url("./genycaster-brand.svg") center/contain no-repeat}
.boot-brand{display:inline-flex;align-items:flex-start;justify-content:center;gap:5px;font-size:26px;line-height:1.3;font-weight:750;letter-spacing:-.045em;white-space:nowrap}
.boot-beta{font-size:10px;font-weight:700;letter-spacing:0;color:#315fff;line-height:1;white-space:nowrap;transform:translateY(3px)}
h1{font-size:17px;line-height:1.45;font-weight:600;letter-spacing:-.01em;margin:0 0 20px}
.boot-track{height:5px;background:#dfe5f1;border-radius:99px;overflow:hidden}
.boot-fill{height:100%;width:28%;border-radius:99px;background:#315fff;animation:indeterminate 1.8s ease-in-out infinite}
.boot-fill.measured{animation:none;transition:width .16s linear}
.boot-foot{display:flex;justify-content:space-between;gap:12px;margin-top:13px;font-size:12px;line-height:1.4;color:#738099}
#boot-percent{font-variant-numeric:tabular-nums;color:#315fff;font-weight:650}
.boot-status{display:none;font-size:13px;line-height:1.55;color:#69758b;margin:16px 0 0;overflow-wrap:anywhere}
#genycaster-boot[data-phase="failed"] .boot-status{display:block}
#genycaster-boot[data-phase="failed"] .boot-fill{animation:none;width:100%;background:#c45b70;opacity:.65}
#boot-retry{display:none;margin:18px auto 0;padding:11px 17px;border:0;border-radius:10px;color:#fff;background:#315fff;font-weight:650;cursor:pointer}
#boot-retry.visible{display:block}
#boot-retry:focus-visible{outline:2px solid #315fff;outline-offset:3px}
@keyframes indeterminate{0%{transform:translateX(-110%)}50%{transform:translateX(135%)}100%{transform:translateX(360%)}}
.boot-build{font-size:11px;font-variant-numeric:tabular-nums;color:#7a859a;letter-spacing:.01em;min-height:16px}
.boot-build:empty{display:none}
.boot-credit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 18px;text-align:center;color:#65728c;font-size:12px;letter-spacing:.015em}
@media(max-width:540px){#genycaster-boot{padding:18px}.boot-content{padding:20px 8px}.boot-mark{margin-bottom:44px}.boot-credit{font-size:11px}}
@media(prefers-reduced-motion:reduce){.boot-fill{animation:none;transform:none;width:40%}*{transition:none!important}}
</style>
</head>
<body>
<div id="qt-screen" aria-label="Genycaster application"></div>
<div id="genycaster-boot" role="status" aria-live="polite">
  <div class="boot-content">
    <div class="boot-mark">
      <span class="boot-glyph" aria-hidden="true"></span>
      <div class="boot-brand">Genycaster<sup class="boot-beta">Beta 1.0</sup></div>
    </div>
    <h1 id="boot-heading">Preparing Genycaster…</h1>
    <p class="boot-status" id="boot-status"></p>
    <div class="boot-track" role="progressbar" aria-label="Application loading" aria-valuetext="Preparing application" id="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-foot"><span id="boot-stage">Checking application files</span><span id="boot-percent" aria-label="Measured download progress"></span></div>
    <button id="boot-retry" type="button">Try again</button>
  </div>
  <div class="boot-credit"><div>Powered by <strong>Genyleap</strong> · WASM Engine</div><div class="boot-build" id="boot-build-credit"></div></div>
</div>
<script src="qtloader.js"></script>
<script src="farcaster_client.js"></script>
<script src="genycaster-assets.js"></script>
<script src="genycaster-loader.js"></script>
</body>
</html>
