# Example STATIC client vhost. Replace hostname, certificate and root.
# Do not reuse the API gateway's no-store policy for the public WASM app.
server {
    listen 443 ssl http2;
    server_name app.example.com;
    root /srv/genycaster/www;
    index genycaster.html;

    ssl_certificate /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/key.pem;

    etag on;
    if_modified_since exact;

    # Enable ONLY when the nginx Brotli module is installed and .br assets
    # were precompressed by the deployment pipeline:
    # brotli_static on;
    # gzip_static on;  # optional alternative if .gz files were generated

    # Addressed by the content digest of the actual binary. Safe to retain
    # indefinitely until the browser chooses to evict it.
    location ~* "^/genycaster\\.[0-9a-f]{20}\\.wasm$" {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /genycaster.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Stable entry URL, generated JS and version metadata: revalidate so
    # updates can be discovered, but do not transfer unchanged bodies.
    location ~* "\\.(html|js|mjs|json|webmanifest|wasm|svg|png|css|woff2)$" {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /genycaster.html;
    }

    # If compiled with Qt WASM threads, COOP+COEP must be enabled site-wide
    # and tested against cross-origin resources before enabling.
    # add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
}
