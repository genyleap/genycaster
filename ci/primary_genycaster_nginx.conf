# Managed GenyCaster primary host. Main WASM at /, historical landing at
# /about/ and release guidance at /download. Restore the previous site file
# atomically if primary-domain origin acceptance fails.
server {
    listen 80;
    listen [::]:80;
    server_name genycaster.xyz;
    root /var/www/genycaster.xyz/public;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://genycaster.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name genycaster.xyz;
    root /var/www/genycaster.xyz/public;
    index genycaster.html;
    charset utf-8;
    access_log /var/log/nginx/genycaster.xyz.access.log;
    error_log /var/log/nginx/genycaster.xyz.error.log;

    ssl_certificate /etc/letsencrypt/live/genycaster.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genycaster.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Host-only account credentials and canonical same-origin CSRF validation.
    location ^~ /api/v1/cloud/ {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_redirect off;
        client_max_body_size 208k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTTPS route attestation; the default status virtual host cannot fake it.
    location = /.well-known/genycaster-ready {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "genycaster-main-v1";
    }

    # Main entry remains at the canonical root; no client-side hop to another
    # Origin, thus no loss of first-party cookies or SIWF relying-party origin.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /genycaster.html =404;
    }
    location = /index.html { return 302 /about/; }
    location = /genycaster.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /genycaster-sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /genycaster-assets.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /genycaster-assets.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /deployment_config.mjs {
        default_type text/javascript;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /releases/native.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /genycaster.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # Content-addressed gzip sidecar: raw gzip bytes consumed by the browser
    # DecompressionStream, never HTTP Content-Encoding. Cache immutably.
    location ~* "\.[a-f0-9]{20}\.wasm\.gz$" {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* "\.[a-f0-9]{20}\.wasm$" {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Preserve the previous landing page rather than destroying its content.
    location = /about { return 302 /about/; }
    location = /about/ {
        add_header Cache-Control "no-store" always;
        try_files /about/index.html =404;
    }
    # Dedicated download hub, independent of the WASM app and legacy /about.
    location = /download {
        add_header Cache-Control "no-store" always;
        try_files /download/index.html =404;
    }
    location = /download/ {
        add_header Cache-Control "no-store" always;
        try_files /download/index.html =404;
    }

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
}
