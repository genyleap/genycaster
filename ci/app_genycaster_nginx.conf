# Production Nginx vhost for the ONLY supported public WebAssembly site.
# Activate after the app.genycaster.xyz DNS record points to this VPS and
# its own valid Let's Encrypt TLS certificate exists. Never replace the
# separate genycaster.xyz landing-page vhost or its assets.
server {
    listen 80;
    listen [::]:80;
    server_name app.genycaster.xyz;
    root /var/www/app.genycaster.xyz/public;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://app.genycaster.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.genycaster.xyz;
    root /var/www/app.genycaster.xyz/public;
    index genycaster.html;
    charset utf-8;
    access_log /var/log/nginx/app.genycaster.xyz.access.log;
    error_log /var/log/nginx/app.genycaster.xyz.error.log;

    ssl_certificate /etc/letsencrypt/live/app.genycaster.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.genycaster.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API cookies are host-only; never share them with the landing page.
    # The account API validates this exact Origin plus forwarded Host.
    location ^~ /api/v1/cloud/ {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_redirect off;
        client_max_body_size 208k;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        return 302 /genycaster.html;
    }
    location = /genycaster.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /genycaster-sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~* \.[a-f0-9]{20}\.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
}
